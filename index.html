<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HitTrax Progress Tracker</title>
<meta name="theme-color" content="#0b1220">
<style>
:root{
  --bg:#0b1220; --bg2:#111b2e; --card:#16233c; --card2:#1d2c49;
  --line:#27395c; --txt:#e9eefb; --dim:#93a4c6; --dim2:#6c7fa5;
  --orange:#FA4616; --blue:#3d6df0; --green:#2fbf71; --red:#ef4d5a; --amber:#f2b13c;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0b1220,#0d1526 60%,#0b1220);color:var(--txt);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;padding-bottom:60px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
a{color:var(--blue)}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}

header{position:sticky;top:0;z-index:30;background:rgba(11,18,32,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding:12px 0}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--orange),#ff8a3d);
  display:grid;place-items:center;font-size:19px;flex:none}
.hd h1{font-size:18px}
.hd .sub{font-size:12px;color:var(--dim);margin-top:1px}
.hd .who{margin-left:auto;text-align:right;font-size:12px;color:var(--dim)}
.hd .who b{display:block;color:var(--txt);font-size:14px}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);
  color:var(--dim);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer}
a.pill.hub{text-decoration:none;color:var(--dim)}
a.pill.hub:hover{color:var(--txt);border-color:var(--blue)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--dim2);flex:none}
.pill.synced .dot{background:var(--green)} .pill.saving .dot{background:var(--amber)}
.pill.offline .dot{background:var(--red)} .pill.local .dot{background:var(--dim2)}
@media(max-width:520px){.pill{padding:5px 9px;font-size:11px}}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:transparent;border:1px solid transparent;color:var(--dim);
  padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer}
nav button.on{background:var(--card2);border-color:var(--line);color:var(--txt)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
.card h2{font-size:15px;margin-bottom:2px}
.card .hint{font-size:12.5px;color:var(--dim);margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim2);
  font-weight:700;margin-bottom:4px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:9px 10px;font:inherit;font-size:15px}
input:focus,select,textarea:focus{outline:2px solid rgba(61,109,240,.5);outline-offset:0}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:150px;resize:vertical}
.f{flex:1 1 130px;min-width:0}
button.btn{background:var(--orange);border:0;color:#fff;font-weight:700;padding:10px 16px;border-radius:10px;
  font-size:14.5px;cursor:pointer}
button.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
button.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
button.btn:active{transform:translateY(1px)}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{background:transparent;border:0;color:var(--dim);padding:6px 12px;border-radius:7px;font-size:13px;
  font-weight:600;cursor:pointer}
.seg button.on{background:var(--orange);color:#fff}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim2);font-weight:700}
.tile .v{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:3px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;font-weight:600;color:var(--dim);margin-left:2px}
.tile .d{font-size:12px;font-weight:700;margin-top:2px}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--dim2)}
.pb{display:inline-block;background:rgba(250,70,22,.16);color:#ff9a6b;border:1px solid rgba(250,70,22,.4);
  font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;letter-spacing:.05em;margin-left:6px;
  vertical-align:middle}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim2);
  font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid rgba(39,57,92,.55);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--card2)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

.bar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#ffa05c)}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--card2);border:1px solid var(--line);color:var(--dim)}
.chip.g{background:rgba(47,191,113,.15);color:#7fe0ab;border-color:rgba(47,191,113,.35)}
.chip.a{background:rgba(242,177,60,.15);color:#f7ce85;border-color:rgba(242,177,60,.35)}
.chip.r{background:rgba(239,77,90,.15);color:#ff9aa2;border-color:rgba(239,77,90,.35)}
.empty{text-align:center;color:var(--dim);padding:34px 10px}
.empty .big{font-size:40px;margin-bottom:8px}
.note{background:rgba(61,109,240,.09);border:1px solid rgba(61,109,240,.3);border-radius:10px;padding:10px 12px;
  font-size:13px;color:#bcd0ff}
.warn{background:rgba(242,177,60,.1);border-color:rgba(242,177,60,.35);color:#f7d9a5}
ul.tight{margin:8px 0 0;padding-left:18px;font-size:13.5px}
ul.tight li{margin:5px 0}
svg{display:block;max-width:100%}
select.inline{background:transparent;border:1px solid transparent;color:var(--dim);padding:3px 4px;
  font-size:13.5px;border-radius:7px;width:auto;max-width:170px;cursor:pointer}
select.inline:hover{border-color:var(--line);background:var(--bg2);color:var(--txt)}
select.inline.sm{font-size:12.5px}
.auto{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:15px;
  color:var(--dim);min-height:39px;display:flex;align-items:center;gap:7px}
.auto b{color:var(--txt);font-size:17px;font-weight:800}
.kindbar{display:flex;align-items:center;gap:9px;padding:0 0 9px;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--dim2);font-weight:700}
.kindbar .seg{padding:2px}
.kindbar .seg button{padding:5px 11px;font-size:12.5px}
.kindbar .count{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--dim)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px 14px;text-align:center;background:var(--bg2)}
.drop.over{border-color:var(--orange);background:rgba(250,70,22,.08)}
.drop .hint{margin:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
dialog{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:16px;padding:0;
  max-width:760px;width:calc(100% - 24px)}
dialog::backdrop{background:rgba(4,8,16,.7)}
.dlg-hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-bd{padding:16px;max-height:74vh;overflow:auto}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
@media print{
  body{background:#fff;color:#000}
  header,nav,.noprint,.seg,select,canvas{display:none!important}   /* controls and animations don't print */
  .card{border-color:#ccc;background:#fff;break-inside:avoid}
  .tile{background:#f4f4f4;border-color:#ddd}
  .k,.dim,.hint{color:#555!important}
  .v,td,th,h1,h2,h3{color:#000!important}
}
</style>
</head>
<body>

<header>
 <div class="wrap">
  <div class="hd">
   <div class="logo">⚾</div>
   <div>
     <h1>HitTrax Progress Tracker</h1>
     <div class="sub" id="hdSub">Session-by-session hitting &amp; catching development</div>
   </div>
   <div class="who" id="who"></div>
   <a class="pill hub" id="hubLink" href="/" title="Back to the Wilson Dashboard" hidden>← Dashboard</a>
   <button class="pill local" id="syncPill" onclick="openAccount()" title="Sync"><i class="dot"></i><span class="lbl">Local only</span></button>
  </div>
  <nav id="nav"></nav>
  <div id="kindBar"></div>
 </div>
</header>

<main class="wrap" id="view"></main>

<dialog id="adlg"><div class="dlg-hd"><h2>Sync across devices</h2>
  <button class="btn ghost" style="margin-left:auto;padding:6px 12px" onclick="adlg.close()">Close</button></div>
  <div class="dlg-bd" id="adlgBody"></div></dialog>

<dialog id="dlg"><div class="dlg-hd"><h2 id="dlgTitle">Session</h2>
  <button class="btn ghost" style="margin-left:auto;padding:6px 12px" onclick="dlg.close()">Close</button></div>
  <div class="dlg-bd" id="dlgBody"></div></dialog>

<script>
/* ============================== storage ============================== */
const KEY='hittrax.tracker.v1';
const uid=()=> (crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(16).slice(2));
// Bump whenever the parser learns a new column — stored source files are re-read on boot so
// older rounds pick up whatever the app can now understand.
const PARSER_V=4;
const blank=()=>({player:{name:'',age:'',level:'',bats:'R'},settings:{hardHit:null},sessions:[],
  files:{},parserV:PARSER_V,deleted:[],goals:[],updatedAt:0});
let DB=blank();
function lsKey(){return session?KEY+'.data.'+session.user.id:KEY}
function load(){
  // signed in: prefer this account's cache, but adopt anything logged before signing in
  const keys=session?[KEY+'.data.'+session.user.id,KEY]:[KEY];
  for(const k of keys){try{const r=localStorage.getItem(k); if(r)return Object.assign(blank(),JSON.parse(r))}catch(e){}}
  return blank();
}
function saveLocal(){try{localStorage.setItem(lsKey(),JSON.stringify(DB))}catch(e){alert('Could not save: '+e.message)}}
function save(){DB.updatedAt=Date.now(); saveLocal(); queuePush();}

/* ============================== cloud sync (Supabase) ============================== */
const SUPA_URL='https://xuipllbtrsebavtffjdy.supabase.co';
const SUPA_KEY='sb_publishable_4Uc4-PMVI4Bsodk6FYYEjg_h2o5xZ0j';
const AUTH=SUPA_URL+'/auth/v1', REST=SUPA_URL+'/rest/v1';
const H={'apikey':SUPA_KEY,'Content-Type':'application/json'};
const SESS_KEY=KEY+'.session', NOBORROW=KEY+'.noborrow', DEADTOK=KEY+'.deadtok';
const BORROW=['budgetApp.session','hubApp.session'];
let EXPIRED=false;
let session=null, sessSrc=null, pushTimer=null, pollTimer=null, serverTs=0, syncState='local';

function readSession(){
  const keys=[SESS_KEY].concat(localStorage.getItem(NOBORROW)?[]:BORROW);
  for(const k of keys){
    try{const raw=localStorage.getItem(k); if(!raw)continue; const s=JSON.parse(raw);
      const dead=localStorage.getItem(DEADTOK);
      if(dead&&s&&s.refresh_token&&s.refresh_token.slice(-24)===dead)continue;   // known-expired
      if(s&&s.access_token&&s.user&&s.user.id){session=s;sessSrc=k;return}}catch(e){}
  }
}
function authStore(s){
  session={access_token:s.access_token,refresh_token:s.refresh_token,user:s.user||(session&&session.user)};
  const j=JSON.stringify(session);
  // write back to whichever app's key the session came from, so that app isn't logged out
  // when the refresh token rotates
  try{localStorage.setItem(SESS_KEY,j); if(sessSrc&&sessSrc!==SESS_KEY)localStorage.setItem(sessSrc,j);
    localStorage.removeItem(NOBORROW); localStorage.removeItem(DEADTOK)}catch(e){}
  EXPIRED=false;
}
function authHeaders(){return {...H,'Authorization':'Bearer '+((session&&session.access_token)||'')}}
async function authSignIn(email,pw){const r=await fetch(AUTH+'/token?grant_type=password',{method:'POST',headers:H,body:JSON.stringify({email,password:pw})});return r.json()}
async function authSignUp(email,pw){const r=await fetch(AUTH+'/signup',{method:'POST',headers:H,body:JSON.stringify({email,password:pw})});return r.json()}
async function authRecover(email){try{await fetch(AUTH+'/recover',{method:'POST',headers:H,body:JSON.stringify({email})})}catch(e){}}
async function authRefresh(){
  if(!session||!session.refresh_token)return false;
  try{
    const r=await fetch(AUTH+'/token?grant_type=refresh_token',{method:'POST',headers:H,body:JSON.stringify({refresh_token:session.refresh_token})});
    if(r.ok){const s=await r.json(); if(s&&s.access_token){authStore(s);return true}}
    if([400,401,403,422].includes(r.status)){sessionExpired();return 'dead'}   // server says this token is finished
  }catch(e){}                                                                  // thrown = offline, keep the session
  return false;
}
function sessionExpired(){
  try{
    if(session&&session.refresh_token)localStorage.setItem(DEADTOK,session.refresh_token.slice(-24));
    localStorage.removeItem(SESS_KEY);                 // never touch the key we borrowed it from
  }catch(e){}
  session=null; sessSrc=null; EXPIRED=true;
  clearInterval(pollTimer); clearTimeout(pushTimer);
  saveLocal();              // keep what's in memory — write it to the signed-out cache, don't reload
  setSync('local');
}
function signOut(){
  clearInterval(pollTimer); clearTimeout(pushTimer);
  try{localStorage.removeItem(SESS_KEY); localStorage.setItem(NOBORROW,'1')}catch(e){}
  session=null; sessSrc=null; serverTs=0; DB=load(); setSync('local'); adlg.close(); render();
}
function setSync(s){
  syncState=s;
  const el=document.getElementById('syncPill'); if(!el)return;
  const map={synced:['Synced','Sessions sync to your account on every device'],
    saving:['Saving…','Pushing this change to your account'],
    offline:['Offline','Saved on this device — will sync when the connection is back'],
    setup:['Setup needed','Signed in, but the hittrax table has not been created yet'],
    local:['Local only','Saved on this device only — tap to sync across devices']};
  el.className='pill '+(s==='setup'?'offline':s);
  el.querySelector('.lbl').textContent=map[s][0]; el.title=map[s][1];
  const a=document.getElementById('acctState'); if(a)a.innerHTML=accountPanel();
}
// merge two docs: sessions union by id (newest mtime wins), tombstones honoured,
// player/settings from whichever doc was touched last
function mergeDocs(a,b){
  const newer=(a.updatedAt||0)>=(b.updatedAt||0)?a:b, older=newer===a?b:a;
  const out=blank();
  out.files=Object.assign({},a.files||{},b.files||{});
  out.parserV=Math.max(a.parserV||0,b.parserV||0);
  out.player=newer.player&&newer.player.name!==undefined?newer.player:older.player;
  out.settings=newer.settings||older.settings||{};
  out.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  const del={};
  [].concat(a.deleted||[],b.deleted||[]).forEach(d=>{del[d.id]=Math.max(del[d.id]||0,d.ts||0)});
  const map={};
  [].concat(a.sessions||[],b.sessions||[]).forEach(s=>{
    const p=map[s.id]; if(!p||(s.mtime||0)>(p.mtime||0))map[s.id]=s;
  });
  Object.keys(del).forEach(id=>{const s=map[id]; if(s&&(s.mtime||0)>del[id])return; delete map[id]});
  out.sessions=Object.keys(map).map(k=>map[k]);
  out.deleted=Object.keys(del).map(id=>({id,ts:del[id]}));
  return out;
}
async function cloudGet(retry){
  if(!session)return undefined;
  try{
    const r=await fetch(REST+'/hittrax?user_id=eq.'+session.user.id+'&select=data,updated_at',{headers:authHeaders()});
    if(r.status===401&&!retry){const ok=await authRefresh(); return ok===true?cloudGet(true):undefined;}
    if(r.status===404)return 'nosetup';
    if(!r.ok)throw 0;
    const rows=await r.json(); return rows[0]||null;
  }catch(e){return undefined}
}
async function cloudSave(retry){
  if(!session)return;
  setSync('saving'); const ts=new Date().toISOString();
  try{
    const r=await fetch(REST+'/hittrax?on_conflict=user_id',{method:'POST',
      headers:{...authHeaders(),'Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify({user_id:session.user.id,data:DB,updated_at:ts})});
    if(r.status===401&&!retry){ const ok=await authRefresh();
      if(ok===true)return cloudSave(true);
      if(ok!=='dead')setSync('offline'); return; }
    if(r.status===404){setSync('setup');return}
    if(!r.ok)throw 0;
    serverTs=new Date(ts).getTime(); setSync('synced');
  }catch(e){setSync('offline')}
}
function queuePush(){ if(!session)return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>cloudSave(),800); }
function busy(){ // don't yank the page out from under an open form
  const a=document.activeElement;
  return (dlg.open||adlg.open||(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT'||a.tagName==='SELECT')));
}
async function pullMerge(initial){
  if(!session)return;
  const row=await cloudGet();
  if(!session){setSync('local');render();return}        // the sign-in died mid-call
  if(row===undefined){setSync('offline');return}
  if(row==='nosetup'){setSync('setup');return}
  if(row&&row.data&&row.data.sessions){
    const merged=mergeDocs(DB,row.data);
    const changed=JSON.stringify(merged)!==JSON.stringify(DB);
    if(changed&&!busy()){DB=merged;saveLocal();render()}
    else if(changed&&initial){DB=merged;saveLocal()}
    serverTs=new Date(row.updated_at).getTime(); setSync('synced');
    // local had something the cloud didn't — push the union back
    if(JSON.stringify(merged)!==JSON.stringify(row.data)&&!busy())await cloudSave();
  }else{ await cloudSave(); }   // first run on this account: create the row
}
function startSync(){
  clearInterval(pollTimer);
  if(!session){setSync('local');return}
  pullMerge(true);
  pollTimer=setInterval(()=>{if(!document.hidden)pullMerge()},12000);
}

/* ---------- import from a link ----------
   A #add=<base64 json> link drops ready-made sessions in, so a box score read off a screenshot
   doesn't have to be retyped. Always shown for confirmation first, and merged, never replacing. */
function readImportLink(){
  const m=(location.hash||'').match(/[#&]add=([A-Za-z0-9_\-+/=]+)/);
  if(!m)return null;
  try{
    const json=decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))));
    const d=JSON.parse(json);
    const list=Array.isArray(d)?d:((d&&d.sessions)||[]);
    const set=(!Array.isArray(d)&&d&&d.settings)||null;
    return (list.length||set)?{list,set}:null;
  }catch(e){return null}
}
function offerImport(payload){
  const list=payload.list||[], set=payload.set||null;
  const setLines=set?Object.keys(set).map(k=>{
    const name={zoneCal:'Strike-zone calibration',hardHit:'Hard-hit threshold'}[k]||k;
    const val=k==='zoneCal'?({none:'use HitTrax zones as exported',mirror:'mirror left ↔ right',
      left:'shift one column left',right:'shift one column right'}[set[k]]||set[k]):set[k];
    return `<li><b>Setting</b> · ${name} → ${esc(String(val))}</li>`;}).join(''):'';
  const lines=setLines+list.map(s=>{
    const k=s.kind||'games', st=k==='games'?computeGame(s.summary||{}):null;
    return `<li><b>${esc(s.date||'')}</b> · ${KIND[k]?KIND[k].label:k}${s.type?' · '+esc(s.type):''}`+
      (st?` — ${st.h||0} for ${st.ab||0}, ${avg3(st.avg)}/${avg3(st.obp)}/${avg3(st.slg)}`:'')+`</li>`;
  }).join('');
  document.getElementById('dlgTitle').textContent='Add these to your tracker?';
  document.getElementById('dlgBody').innerHTML=`
    <div class="hint">Sent to you as a link. Nothing is replaced — these merge in alongside what you already have.</div>
    <ul class="tight" style="margin-top:10px">${lines}</ul>
    <div class="row" style="margin-top:16px">
      <button class="btn" onclick="acceptImport()">${list.length?`Add ${list.length} entr${list.length>1?'ies':'y'}`:'Apply'}</button>
      <button class="btn ghost" onclick="declineImport()">No thanks</button></div>`;
  PENDING_IMPORT=payload;
  if(!dlg.open)dlg.showModal();
}
let PENDING_IMPORT=null;
function acceptImport(){
  const now=Date.now(), p=PENDING_IMPORT||{};
  if(p.set)Object.assign(DB.settings,p.set);
  (p.list||[]).forEach((s,i)=>{
    DB.sessions.push({...s,id:uid(),kind:s.kind||'games',mode:s.mode||'game',mtime:now+i});
  });
  const wasGames=(p.list||[]).some(s=>(s.kind||'games')==='games');
  PENDING_IMPORT=null; save(); clearHash();
  if(wasGames)VIEWKIND='games';
  dlg.close(); go('dash');
}
function declineImport(){PENDING_IMPORT=null; clearHash(); dlg.close();}
function clearHash(){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}

/* ---------- account UI ---------- */
function accountPanel(){
  if(!session)return `<div class="hint">Not signed in — sessions are saved on this device only.</div>`;
  const label={synced:['g','Synced'],saving:['a','Saving…'],offline:['r','Offline'],
    setup:['r','Table not created yet'],local:['','Local only']}[syncState]||['','—'];
  return `<div class="row" style="align-items:center;gap:8px">
    <span class="chip ${label[0]}">${label[1]}</span>
    <span style="font-size:13px;color:var(--dim)">${esc(session.user.email||'')}</span></div>
    ${syncState==='setup'?`<div class="note warn" style="margin-top:10px">The <b>hittrax</b> table doesn't exist in Supabase yet.
      Run <span class="mono">supabase-setup.sql</span> once in the Supabase SQL editor, then reload — everything logged here is safe on this device in the meantime.</div>`:''}`;
}
function openAccount(){
  document.getElementById('adlgBody').innerHTML=session?`
    <div id="acctState">${accountPanel()}</div>
    <div class="hint" style="margin-top:12px">Sessions logged on any device signed in to this account merge together —
      nothing overwrites anything, and deletes carry across too.</div>
    <div class="row" style="margin-top:14px">
      <button class="btn sec" onclick="pullMerge();">Sync now</button>
      <button class="btn ghost" onclick="signOut()">Sign out on this device</button></div>`
   :`<div class="hint">Sign in with the same email and password you use for the Budget app — sessions then follow you
      from the cage to the couch. Everything already logged on this device gets merged in, not replaced.</div>
    <div class="grid" style="grid-template-columns:1fr;gap:10px;margin-top:12px">
      <div><label>Email</label><input id="a_email" type="email" autocomplete="username" value="${esc(guessEmail())}"></div>
      <div><label>Password</label><input id="a_pw" type="password" autocomplete="current-password"></div>
    </div>
    <div id="a_msg" style="font-size:13px;color:var(--dim);margin-top:10px;min-height:18px"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn" onclick="doSignIn()">Sign in</button>
      <button class="btn sec" onclick="doSignUp()">Create account</button>
      <button class="btn ghost" onclick="doRecover()">Forgot password</button></div>`;
  adlg.showModal();
  const pw=document.getElementById('a_pw');
  if(pw)pw.onkeydown=e=>{if(e.key==='Enter')doSignIn()};
}
function guessEmail(){
  for(const k of BORROW){try{const s=JSON.parse(localStorage.getItem(k)); if(s&&s.user&&s.user.email)return s.user.email}catch(e){}}
  return '';
}
function amsg(t,err){const e=document.getElementById('a_msg'); if(e){e.textContent=t;e.style.color=err?'var(--red)':'var(--dim)'}}
async function afterAuth(){
  sessSrc=SESS_KEY; adlg.close();
  const local=DB; DB=load(); DB=mergeDocs(DB,local); saveLocal();  // keep what this device already had
  render(); await pullMerge(true); startSync(); render();
}
async function doSignIn(){
  const e=document.getElementById('a_email').value.trim(), p=document.getElementById('a_pw').value;
  if(!e||!p){amsg('Enter your email and password.',true);return}
  amsg('Signing in…');
  const r=await authSignIn(e,p);
  if(r&&r.access_token){authStore(r);afterAuth()}
  else amsg((r&&(r.error_description||r.msg||r.error))||'Sign-in failed.',true);
}
async function doSignUp(){
  const e=document.getElementById('a_email').value.trim(), p=document.getElementById('a_pw').value;
  if(!e||p.length<6){amsg('Enter an email and a password of at least 6 characters.',true);return}
  amsg('Creating account…');
  const r=await authSignUp(e,p);
  if(r&&r.access_token){authStore(r);afterAuth()}
  else if(r&&(r.id||r.user||r.confirmation_sent_at!==undefined))amsg('Account created — check your email to confirm, then sign in.');
  else amsg((r&&(r.error_description||r.msg||r.error))||'Sign-up failed.',true);
}
async function doRecover(){
  const e=document.getElementById('a_email').value.trim();
  if(!e){amsg('Enter your email first.',true);return}
  await authRecover(e); amsg('If that account exists, a reset email is on its way.');
}

/* ============================== computation ============================== */
// Launch-angle buckets (HitTrax-style): GB <10, LD 10–25, FB 25–50, PU >50
function bucket(la){ if(la==null||isNaN(la))return null; if(la<10)return'gb'; if(la<=25)return'ld'; if(la<=50)return'fb'; return'pu'; }
const HITVAL={out:0,single:1,double:2,triple:3,hr:4,foul:null,error:0};
function computeFromBalls(balls,hh){
  const b=balls.filter(x=>x.ev!=null&&!isNaN(x.ev)&&x.ev>0);
  if(!b.length) return null;
  const evs=b.map(x=>+x.ev).sort((p,q)=>q-p);
  const n=evs.length, topN=Math.max(1,Math.round(n*0.25));
  const las=b.filter(x=>x.la!=null&&!isNaN(x.la)).map(x=>+x.la);
  const dists=b.filter(x=>x.dist!=null&&!isNaN(x.dist)&&x.dist>0).map(x=>+x.dist);
  const cnt={gb:0,ld:0,fb:0,pu:0}; let cls=0;
  // HitTrax labels each ball itself (the Type column) — use its label when the export has
  // one so these percentages match the report, and fall back to launch-angle buckets.
  b.forEach(x=>{const k=x.btype||bucket(x.la); if(k&&cnt[k]!==undefined){cnt[k]++;cls++;}});
  const hard=b.filter(x=>+x.ev>=hh).length;
  const barrel=b.filter(x=>+x.ev>=hh && x.la!=null && +x.la>=8 && +x.la<=32).length;
  const sweet=las.filter(v=>v>=8&&v<=32).length;
  const s={
    swings:n,
    maxEV:evs[0],
    avgEV:evs.reduce((a,c)=>a+c,0)/n,
    topEV:evs.slice(0,topN).reduce((a,c)=>a+c,0)/topN,
    hha:hard/n*100,
    barrel:barrel/n*100,
    avgLA:las.length?las.reduce((a,c)=>a+c,0)/las.length:null,
    sweet:las.length?sweet/las.length*100:null,
    gb:cls?cnt.gb/cls*100:null, ld:cls?cnt.ld/cls*100:null,
    fb:cls?cnt.fb/cls*100:null, pu:cls?cnt.pu/cls*100:null,
    maxDist:dists.length?Math.max(...dists):null,
    avgDist:dists.length?dists.reduce((a,c)=>a+c,0)/dists.length:null,
    ba:null,slg:null
  };
  const res=b.filter(x=>x.result&&HITVAL[x.result]!=null);
  if(res.length>=5){
    const tb=res.reduce((a,c)=>a+HITVAL[c.result],0);
    const hits=res.filter(x=>HITVAL[x.result]>0).length;
    s.ba=hits/res.length; s.slg=tb/res.length;
  }
  return s;
}
// A HitTrax catching export logs every pitch: clean throw-downs, botched reps (ball on the
// ground, double clutch - pop balloons past 4s) and rows with no throw at all (pop 0.00).
// Averaging all of them together hides real progress, so the headline numbers use clean reps
// and the misfires become their own metric.
const CLEAN={popLo:1.2,popHi:4.0};
function throwClass(x){
  const pop=num(x.pop), velo=num(x.velo);
  if((pop==null||pop<=0.2)&&(velo==null||velo<=15))return'none';
  if(pop==null||pop<=0.2)return'nothrow';
  return (pop<CLEAN.popLo||pop>CLEAN.popHi)?'misfire':'clean';
}
const cleanThrows=T=>(T||[]).filter(x=>throwClass(x)==='clean');
function computeFromThrows(T){
  const all=(T||[]).filter(x=>throwClass(x)!=='none');
  const t=all.filter(x=>throwClass(x)==='clean');
  const measured=all.filter(x=>throwClass(x)!=='nothrow');
  if(!all.length)return null;
  if(!t.length)return {throws:0,attempts:all.length,misfires:all.length,cleanPct:0};
  const pops=t.map(x=>num(x.pop)).filter(v=>v!=null).sort((a,b)=>a-b);
  const exch=t.map(x=>num(x.exch)).filter(v=>v!=null&&v>0.2&&v<3);
  const velos=t.map(x=>num(x.velo)).filter(v=>v!=null&&v>15&&v<120);
  const miss=t.map(x=>num(x.miss)).filter(v=>v!=null&&v>=0);
  const diffs=t.map(x=>num(x.diff)).filter(v=>v!=null);
  const called=measured.filter(x=>x.outcome==='out'||x.outcome==='safe');
  const avg=a=>a.length?a.reduce((x,c)=>x+c,0)/a.length:null;
  const topN=Math.max(1,Math.round(pops.length*0.25));
  // on target = an explicit flag from the file, else a miss inside ON_TARGET_IN
  const flagged=t.filter(x=>x.ontarget===true||x.ontarget===false);
  let onTarget=null;
  if(flagged.length)onTarget=flagged.filter(x=>x.ontarget===true).length/flagged.length*100;
  else if(miss.length)onTarget=miss.filter(v=>v<=ON_TARGET_IN).length/miss.length*100;
  return {
    throws:t.length,
    attempts:all.length,
    misfires:all.filter(x=>throwClass(x)==='misfire').length,
    nothrows:all.filter(x=>throwClass(x)==='nothrow').length,
    cleanPct:all.length?t.length/all.length*100:null,
    avgDiff:diffs.length?avg(diffs):null,
    bestPop:pops.length?pops[0]:null,
    avgPop:avg(pops),
    top25Pop:pops.length?avg(pops.slice(0,topN)):null,
    bestExch:exch.length?Math.min(...exch):null,
    avgExch:avg(exch),
    maxVelo:velos.length?Math.max(...velos):null,
    avgVelo:avg(velos),
    onTarget,
    outPct:called.length?called.filter(x=>x.outcome==='out').length/called.length*100:null,
    avgMiss:avg(miss),
  };
}
function sessionStats(s){
  if(kindOf(s)==='games')return computeGame(s.summary||{});
  if(kindOf(s)==='catching'){
    if(s.mode!=='mixed'&&s.throws&&s.throws.length){const c=computeFromThrows(s.throws); if(c)return c;}
    return s.summary||{};
  }
  if(s.mode==='detail'&&s.balls&&s.balls.length){const c=computeFromBalls(s.balls,HH()); if(c)return c;}
  return s.summary||{};
}
const rawSorted=(kind)=>DB.sessions.filter(s=>kindOf(s)===(kind||VIEWKIND))
  .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
/* One day = one session. HitTrax writes a file per round, so a single trip to the cage can
   arrive as several uploads; everything downstream works on day-sessions, with the individual
   uploads kept underneath so they can still be inspected and deleted. */
const GROUPS={in:'Grouped',solo:'Separate',out:'Excluded'};
const dispo=s=>s.group||'in';
function daySessions(kind){
  kind=kind||VIEWKIND;
  const by={}, out=[];
  rawSorted(kind).forEach(s=>{(by[s.date]=by[s.date]||[]).push(s)});
  Object.keys(by).sort().forEach(d=>{
    const parts=by[d];
    const grouped=parts.filter(s=>dispo(s)==='in');
    if(grouped.length)out.push(dayOf(grouped,kind));
    parts.filter(s=>dispo(s)==='solo').forEach(s=>out.push(Object.assign({},s,{parts:[s],solo:true})));
  });
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
const excludedOf=kind=>DB.sessions.filter(s=>kindOf(s)===(kind||VIEWKIND)&&dispo(s)==='out')
  .sort((a,b)=>a.date<b.date?1:-1);
// every round logged on that date, whatever its disposition — the breakdown edits them all
const roundsOfDate=s=>DB.sessions.filter(x=>kindOf(x)===kindOf(s)&&x.date===s.date)
  .sort((a,b)=>(a.mtime||0)-(b.mtime||0));
function setGroup(id,val){
  const raw=DB.sessions.find(x=>x.id===id); if(!raw)return;
  raw.group=val; raw.mtime=Date.now(); save(); render();
  if(!dlg.open)return;
  // the day this round belonged to may have just split, merged or emptied — follow it
  const list=sorted(kindOf(raw));
  const target=(val==='solo'&&list.find(e=>e.id===raw.id))
    || list.find(e=>e.date===raw.date&&(e.parts||[]).some(x=>x.id===raw.id))
    || list.find(e=>e.date===raw.date);
  target?openSession(target.id):dlg.close();
}
function dayOf(parts,kind){
  const p0=parts[0];
  if(parts.length===1)return Object.assign({},p0,{parts:[p0],dayId:p0.id});
  const balls=parts.flatMap(s=>s.balls||[]), throws=parts.flatMap(s=>s.throws||[]);
  const rows=kind==='catching'?throws:balls;
  // only recompute from raw rows when EVERY round has them, else a typed round would vanish
  const allRows=parts.every(s=>((kind==='catching'?s.throws:s.balls)||[]).length>0);
  const day={id:'day:'+kind+':'+p0.date, dayId:'day:'+kind+':'+p0.date, parts, kind, date:p0.date,
    mode:allRows?'detail':'mixed',
    type:[...new Set(parts.map(s=>s.type).filter(Boolean))].join(' + '),
    location:[...new Set(parts.map(s=>s.location).filter(Boolean))].join(', '),
    notes:parts.map(s=>s.notes).filter(Boolean).join(' · '),
    balls, throws};
  // every upload has raw rows -> recompute exactly; otherwise fold the typed summaries together
  day.summary=kind==='games'?sumGames(parts.map(sessionStats))
    :(allRows?(kind==='catching'?computeFromThrows(throws):computeFromBalls(balls,HH()))
             :mergeSummaries(parts.map(sessionStats),kind));
  const pitches=parts.map(s=>num(s.pitch)).filter(v=>v>0);
  day.pitch=allRows?avgPitch(rows):(pitches.length?Math.round(pitches.reduce((a,c)=>a+c,0)/pitches.length):null);
  return day;
}
// typed-summary rounds: sum the counts, keep the best best, weight the rest by round size
function mergeSummaries(list,kind){
  const out={}, wkey=kind==='catching'?'throws':'swings';
  const SUM=['swings','throws','attempts','misfires','nothrows'];
  (kind==='catching'?CM:M).forEach(m=>{
    const vals=list.map(s=>({v:num(s[m.k]),w:num(s[wkey])||1})).filter(x=>x.v!=null);
    if(!vals.length)return;
    if(SUM.includes(m.k))out[m.k]=vals.reduce((a,c)=>a+c.v,0);
    else if(m.dir==='up'&&/^(max|best|top)/i.test(m.k))out[m.k]=Math.max(...vals.map(x=>x.v));
    else if(m.dir==='down'&&/^(best|top)/i.test(m.k))out[m.k]=Math.min(...vals.map(x=>x.v));
    else out[m.k]=vals.reduce((a,c)=>a+c.v*c.w,0)/vals.reduce((a,c)=>a+c.w,0);
  });
  return out;
}
const sorted=(kind)=>daySessions(kind);
const countOf=kind=>daySessions(kind).length;
const findSession=id=>DB.sessions.find(s=>s.id===id)||sorted('hitting').concat(sorted('catching')).find(s=>s.id===id);
function series(k){return sorted().map(s=>({date:s.date,id:s.id,v:num(sessionStats(s)[k])})).filter(p=>p.v!=null);}
function num(v){return (v===''||v==null||isNaN(v))?null:+v;}
function fmt(k,v){ if(v==null)return'—'; const m=MK[k]; const s=(+v).toFixed(m.d);
  return m.d===3?s.replace(/^0/,''):s; }
function best(k){const S=series(k); if(!S.length)return null; const dir=MK[k].dir;
  if(dir==='down')return S.reduce((a,c)=>c.v<a.v?c:a);
  if(dir==='up')return S.reduce((a,c)=>c.v>a.v?c:a); return null;}
function delta(k,i){ // change vs previous session that has this metric
  const S=series(k); const idx=S.findIndex(p=>p.id===i);
  if(idx<1)return null; return S[idx].v-S[idx-1].v;
}
function dirClass(k,d){ if(d==null)return'flat'; const dir=MK[k].dir;
  if(+(+d).toFixed(decimals(k))===0)return'flat';   // rounds to nothing at the shown precision
  if(dir==='up')return d>0?'up':'down';
  if(dir==='down')return d<0?'up':'down'; return'flat';}
function decimals(k){const m=MK[k]; return m.d===3?3:(m.u==='s'?2:(Math.abs(1)<10?1:0));}
function dstr(k,d){ if(d==null)return''; const v=+(+d).toFixed(decimals(k));
  return (v>0?'+':'')+v.toFixed(decimals(k)); }
function rolling(S,w){return S.map((p,i)=>{const sl=S.slice(Math.max(0,i-w+1),i+1);
  return {date:p.date,v:sl.reduce((a,c)=>a+c.v,0)/sl.length}});}

/* ============================== paste parser ============================== */
const ALIAS={
  ev:['velo','exitvelocity','exitvelo','ev','exitballvelocity','ballvelocity','velocity','exitspeed','speed'],
  la:['la','launchangle','angle','elev','elevation','verticalangle','va'],
  dist:['dist','distance','projdistance','projecteddistance','carry'],
  horiz:['horiz','horizangle','horizontalangle','spray','sprayangle','direction','dir','ha'],
  poi:['poi','pointofimpact','contact','impact'],
  result:['result','play','playoutcome','outcome','res'],
  btype:['type','hittype','battedballtype','balltype'],
  pitch:['pitchvelo','pitchspeed','pitch','pv'],
  date:['date','sessiondate','timestamp','datetime','day','sessiontimestamp'],
  zone:['strikezone','zone','pitchzone','szone'],
  sprayx:['spraychartx','sprayx'],
  sprayz:['spraychartz','sprayz'],
  poix:['poix'], poiy:['poiy'], poiz:['poiz'],
  szbot:['strikezonebottom'], sztop:['strikezonetop'], szwidth:['strikezonewidth'],
  user:['user','player','playername','name','hitter','batter'],
  level:['level','age','agegroup','division']
};
// HitTrax's own Type column: LD / FB / GB (and PU where present)
function parseBtype(t){const s=normKey(t);
  if(s==='ld'||s==='linedrive')return'ld';
  if(s==='gb'||s==='groundball')return'gb';
  if(s==='fb'||s==='flyball')return'fb';
  if(s==='pu'||s==='pop'||s==='popup'||s==='pf')return'pu';
  return null;}
function normKey(h){return h.toLowerCase().replace(/[^a-z]/g,'');}
function mapCol(h){const n=normKey(h); for(const f in ALIAS){if(ALIAS[f].includes(n))return f;} return null;}
// "9/14/2026 4:32 PM", "2026-09-14", "14-Sep-26" -> 2026-09-14
function parseDate(raw){
  if(raw==null)return null;
  const s=(''+raw).trim(); if(!s)return null;
  if(/^\d{1,2}:\d{1,2}:\d/.test(s))return null;   // elapsed "Time Stamp" column, not a date
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if(m){let y=+m[3]; if(y<100)y+=y<70?2000:1900;
    return `${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;}   // US order, as HitTrax exports
  const t=Date.parse(s);
  if(!isNaN(t)){const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  return null;
}
// delimited-line split that respects "quoted, fields"
function splitLine(line,d){
  const out=[]; let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c }
    else if(c==='"')q=true;
    else if(c===d){out.push(cur);cur=''}
    else cur+=c;
  }
  out.push(cur); return out.map(s=>s.trim());
}
function numField(raw){
  let s=(''+raw).trim();
  if(/^-?\d+,\d{1,2}$/.test(s))s=s.replace(',','.');   // decimal comma ("70,5"), not a thousands separator
  const v=parseFloat(s.replace(/[^\d.\-]/g,''));
  return isNaN(v)?null:v;
}
function pickDelim(line){
  const counts=['\t',',',';','|'].map(d=>[d,splitLine(line,d).length]);
  counts.sort((a,b)=>b[1]-a[1]);
  return counts[0][1]>1?counts[0][0]:null;
}
// Handles both plain words and HitTrax's scorebook notation ("1B-8", "F3", "6-3", "E5").
function parseResult(t){ if(t==null)return null; const s=(''+t).toLowerCase().trim();
  if(!s)return null;
  if(/^(hr|home ?run)\b|^hr-/.test(s))return'hr';
  if(/^3b\b|^3b-|triple/.test(s))return'triple';
  if(/^2b\b|^2b-|double/.test(s))return'double';
  if(/^1b\b|^1b-|single/.test(s))return'single';
  if(/foul/.test(s))return'foul';
  if(/^e\d|error/.test(s))return'error';
  if(/^(bb|ibb|hbp|walk)\b/.test(s))return null;        // not an at-bat
  if(/^(k|so|strikeout)\b/.test(s))return'out';
  if(/^[fplgu]?\d(-\d)*$/.test(s))return'out';          // F3, P5, L7, 6-3, 4-6-3, 3
  if(/out|fly|ground|pop|lineout|fc|dp|sac/.test(s))return'out';
  return null;}
function looksLikeMarkup(txt){return /^\s*<(!doctype|html|\?xml)/i.test(txt||'')}
function parsePaste(txt){
  if(looksLikeMarkup(txt))return{balls:[],msg:'That looks like a web page, not a CSV — check the file.',dates:[]};
  const lines=(txt||'').replace(/^﻿/,'').split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
  if(!lines.length)return{balls:[],msg:'Nothing to parse.',dates:[]};
  // HitTrax exports often carry a title/player row or two above the real header,
  // so hunt for the line that maps the most known columns instead of assuming row 1.
  let cols=null,start=0,delim=null,hdr=-1,bestN=1;
  for(let i=0;i<Math.min(lines.length,25);i++){
    const d=pickDelim(lines[i]); if(!d)continue;
    const parts=splitLine(lines[i],d);
    const mapped=parts.map(mapCol), n=mapped.filter(Boolean).length;
    if(n>bestN && parts.some(p=>p&&isNaN(parseFloat(p)))){bestN=n;cols=mapped;delim=d;hdr=i}
  }
  if(cols){start=hdr+1}
  const split=l=>delim?splitLine(l,delim):l.split(/\t|,|\s{2,}|\s+/).map(s=>s.trim());
  const balls=[]; let skipped=0;
  for(let i=start;i<lines.length;i++){
    const parts=split(lines[i]);
    const b={};
    if(cols){
      cols.forEach((c,j)=>{ if(!c)return; const raw=parts[j]; if(raw==null||raw==='')return;
        if(c==='result'){const r=parseResult(raw); if(r)b.result=r;}
        else if(c==='btype'){const t=parseBtype(raw); if(t)b.btype=t;}
        else if(c==='poi')b.poi=raw;
        else if(c==='user'||c==='level')b[c]=raw;
        else if(c==='date'){const d=parseDate(raw); if(d)b.date=d}
        else {const v=numField(raw); if(v!=null)b[c]=v;} });
    }else{
      const nums=parts.map(numField).filter(v=>v!=null);
      if(nums.length>=1)b.ev=nums[0];
      if(nums.length>=2)b.la=nums[1];
      if(nums.length>=3)b.dist=nums[2];
      const r=parts.map(parseResult).find(Boolean); if(r)b.result=r;
    }
    if(b.ev!=null&&b.ev>0&&b.ev<200)balls.push(b); else if(parts.length>1)skipped++;
  }
  const dates=[...new Set(balls.map(b=>b.date).filter(Boolean))].sort();
  let msg;
  if(!balls.length)msg='No rows recognized — check that a column holds exit velocity numbers.';
  else{
    msg=`Parsed ${balls.length} batted ball${balls.length>1?'s':''}`;
    if(dates.length>1)msg+=` across ${dates.length} dates (${dates[0]} → ${dates[dates.length-1]})`;
    else if(dates.length===1)msg+=` from ${dates[0]}`;
    msg+='.'+(skipped?` ${skipped} row${skipped>1?'s':''} without a usable exit velo skipped.`:'');
  }
  return {balls,msg,dates};
}

/* ---------- catching export ---------- */
const CALIAS={
  pop:['pop','poptime','poptimesec','poptimeseconds','pt','popsec'],
  exch:['exchg','exchange','exchangetime','transfer','transfertime','exch','release','releasetime'],
  velo:['throw','velo','armstrength','arm','throwvelo','throwvelocity','velocity','speed','mph','throwspeed','throwmph'],
  miss:['miss','missdistance','accuracy','acc','distancefrombase','distfrombase','offtarget','distancefromtarget','accuracyin'],
  outcome:['res','outcome','projectedoutcome','projection','result','call','safeout','projectedresult'],
  base:['base','targetbase','target','throwto','throwtobase'],
  diff:['sec','timedifferential','differential','timediff','diff','delta','secs'],
  pitch:['pitch','pitchvelo','pitchspeed'],
  date:['date','sessiondate','datetime','day'],
  user:['user','player','playername','name','catcher'],
  level:['level','agegroup','division']
};
function mapCCol(h){const n=normKey(h); for(const f in CALIAS){if(CALIAS[f].includes(n))return f;} return null;}
function parseOutcome(t){const s=(''+t).toLowerCase().trim();
  if(/^out\b|safe ?= ?no|caught|^o$/.test(s))return'out';
  if(/^safe\b|^s$|stolen/.test(s))return'safe';
  return null;}
function parseThrows(txt){
  if(looksLikeMarkup(txt))return{throws:[],msg:'That looks like a web page, not a CSV — check the file.',dates:[],unmapped:[]};
  const lines=(txt||'').replace(/^﻿/,'').split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
  if(!lines.length)return{throws:[],msg:'Nothing to parse.',dates:[],unmapped:[]};
  let cols=null,delim=null,hdr=-1,bestN=0,heads=[];
  for(let i=0;i<Math.min(lines.length,25);i++){
    const d=pickDelim(lines[i]); if(!d)continue;
    const parts=splitLine(lines[i],d);
    const mapped=parts.map(mapCCol), n=mapped.filter(Boolean).length;
    if(n>bestN&&parts.some(p=>p&&isNaN(parseFloat(p)))){bestN=n;cols=mapped;delim=d;hdr=i;heads=parts}
  }
  if(!cols)return{throws:[],msg:'No header row recognized — the file needs a column for pop time or throw velocity.',dates:[],unmapped:[]};
  const split=l=>splitLine(l,delim);
  const T=[]; let skipped=0;
  for(let i=hdr+1;i<lines.length;i++){
    const parts=split(lines[i]), t={};
    cols.forEach((c,j)=>{ if(!c)return; const raw=parts[j]; if(raw==null||raw==='')return;
      if(c==='outcome'){const o=parseOutcome(raw); if(o)t.outcome=o;}
      else if(c==='base'||c==='user'||c==='level')t[c]=raw;
      else if(c==='date'){const d=parseDate(raw); if(d)t.date=d}
      else if(c==='miss'){
        const v=numField(raw);
        if(v!=null){ t.miss=/f(ee)?t\.?$|'$/.test((''+raw).trim())?v*12:v;     // "3 ft" -> inches
          if(/^(yes|no|on|off)/i.test((''+raw).trim()))t.ontarget=/^(yes|on)/i.test((''+raw).trim()); }
        else if(/^(yes|no|on ?target|off ?target|hit|miss)/i.test((''+raw).trim()))
          t.ontarget=/^(yes|on ?target|hit)/i.test((''+raw).trim());
      }
      else {const v=numField(raw); if(v!=null)t[c]=v;} });
    if(t.pop!=null&&t.pop>20)t.pop=t.pop/1000;          // milliseconds export
    if(t.exch!=null&&t.exch>10)t.exch=t.exch/1000;
    if(num(t.pop)!=null||num(t.velo)!=null)T.push(t); else if(parts.length>1)skipped++;
  }
  const dates=[...new Set(T.map(t=>t.date).filter(Boolean))].sort();
  const NOISE=['','#','no','ab','pts','tag','timestamp','time','session','inning','count','velo2'];
  const unmapped=heads.filter((h,j)=>h&&!cols[j]&&!NOISE.includes(normKey(h)));
  let msg;
  if(!T.length)msg='No throws recognized — check that a column holds pop time or throw velocity.';
  else{
    msg=`Parsed ${T.length} throw${T.length>1?'s':''}`;
    if(dates.length>1)msg+=` across ${dates.length} dates (${dates[0]} → ${dates[dates.length-1]})`;
    else if(dates.length===1)msg+=` from ${dates[0]}`;
    msg+='.'+(skipped?` ${skipped} row${skipped>1?'s':''} skipped.`:'');
  }
  return {throws:T,msg,dates,unmapped};
}

/* ============================== charts (inline SVG) ============================== */
function esc(s){return (''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function lineChart(S,k,opt={}){
  if(S.length<1)return '<div class="empty">Not enough data yet.</div>';
  const W=720,H=250,P={l:44,r:14,t:16,b:30};
  const vals=S.map(p=>p.v); let lo=Math.min(...vals),hi=Math.max(...vals);
  if(opt.band){lo=Math.min(lo,opt.band[0]);hi=Math.max(hi,opt.band[1]);}
  if(hi-lo<1e-6){const p=Math.max(Math.abs(lo)*0.06,0.05); hi=lo+p; lo=lo-p;}   // single session: keep the scale sane const pad=(hi-lo)*0.15; lo-=pad;hi+=pad;
  if(MK[k].u==='%'){lo=Math.max(0,lo);hi=Math.min(100,hi);}
  const x=i=>P.l+(S.length===1?(W-P.l-P.r)/2:i*(W-P.l-P.r)/(S.length-1));
  const y=v=>P.t+(H-P.t-P.b)*(1-(v-lo)/(hi-lo));
  const pts=S.map((p,i)=>[x(i),y(p.v)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L${pts[pts.length-1][0].toFixed(1)} ${H-P.b} L${pts[0][0].toFixed(1)} ${H-P.b} Z`;
  let g='';
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,yy=y(v);
    g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="#27395c" stroke-width="1"/>`+
       `<text x="${P.l-7}" y="${(yy+4).toFixed(1)}" fill="#6c7fa5" font-size="11" text-anchor="end">${v.toFixed(MK[k].d===3?3:(hi-lo<15?1:0))}</text>`;}
  let bandEl='';
  if(opt.band){const y1=y(Math.min(opt.band[1],hi)),y2=y(Math.max(opt.band[0],lo));
    bandEl=`<rect x="${P.l}" y="${y1.toFixed(1)}" width="${W-P.l-P.r}" height="${Math.max(0,y2-y1).toFixed(1)}" fill="rgba(47,191,113,.10)"/>`;}
  let roll='';
  if(S.length>=3){const R=rolling(S,3);
    roll=`<path d="${R.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ')}" fill="none" stroke="#3d6df0" stroke-width="2" stroke-dasharray="5 4" opacity=".85"/>`;}
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.6" fill="#FA4616" stroke="#0b1220" stroke-width="1.5"><title>${esc(S[i].date)} — ${fmt(k,S[i].v)}</title></circle>`).join('');
  const step=Math.ceil(S.length/6);
  const xl=S.map((p,i)=>i%step===0||i===S.length-1?`<text x="${x(i).toFixed(1)}" y="${H-9}" fill="#6c7fa5" font-size="10.5" text-anchor="middle">${p.date.slice(5)}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet">
   ${bandEl}${g}
   <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
     <stop offset="0%" stop-color="#FA4616" stop-opacity=".28"/><stop offset="100%" stop-color="#FA4616" stop-opacity="0"/>
   </linearGradient></defs>
   <path d="${area}" fill="url(#ag)"/>
   <path d="${path}" fill="none" stroke="#FA4616" stroke-width="2.5" stroke-linejoin="round"/>
   ${roll}${dots}${xl}</svg>`;
}
function scatterLAEV(balls,hh){
  const b=balls.filter(x=>x.ev!=null&&x.la!=null);
  if(b.length<2)return '';
  const W=700,H=280,P={l:42,r:12,t:14,b:32};
  const evs=b.map(x=>+x.ev); const loE=Math.min(...evs)-4,hiE=Math.max(...evs)+4;
  const loA=-30,hiA=60;
  const x=v=>P.l+(W-P.l-P.r)*(Math.max(loA,Math.min(hiA,v))-loA)/(hiA-loA);
  const y=v=>P.t+(H-P.t-P.b)*(1-(v-loE)/(hiE-loE));
  let g='';
  for(let a=loA;a<=hiA;a+=15)g+=`<line x1="${x(a)}" x2="${x(a)}" y1="${P.t}" y2="${H-P.b}" stroke="#27395c"/>`+
    `<text x="${x(a)}" y="${H-11}" fill="#6c7fa5" font-size="10.5" text-anchor="middle">${a}°</text>`;
  for(let i=0;i<=4;i++){const v=loE+(hiE-loE)*i/4,yy=y(v);
    g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="#27395c"/>`+
       `<text x="${P.l-6}" y="${yy+4}" fill="#6c7fa5" font-size="10.5" text-anchor="end">${v.toFixed(0)}</text>`;}
  const zone=`<rect x="${x(8)}" y="${P.t}" width="${x(32)-x(8)}" height="${y(hh)-P.t}" fill="rgba(47,191,113,.13)"/>
   <text x="${(x(8)+x(32))/2}" y="${P.t+16}" fill="#7fe0ab" font-size="11" text-anchor="middle" font-weight="700">DAMAGE ZONE</text>`;
  const dots=b.map(p=>{const hard=+p.ev>=hh&&+p.la>=8&&+p.la<=32;
    return `<circle cx="${x(+p.la).toFixed(1)}" cy="${y(+p.ev).toFixed(1)}" r="4.5" fill="${hard?'#2fbf71':'#FA4616'}" opacity=".85"><title>${(+p.ev).toFixed(1)} mph @ ${(+p.la).toFixed(0)}°</title></circle>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${g}${zone}${dots}
    <text x="${W/2}" y="${H-1}" fill="#6c7fa5" font-size="10" text-anchor="middle">launch angle →</text></svg>`;
}
/* A proper field, the way HitTrax draws it. Uses the export's Spray Chart X/Z landing
   coordinates when they're there, and falls back to distance + horizontal angle. */
function landing(b){
  if(num(b.sprayx)!=null&&num(b.sprayz)!=null&&(Math.abs(b.sprayx)>0.01||b.sprayz>0.01))
    return {x:+b.sprayx, z:+b.sprayz};
  const d=num(b.dist), a=num(b.horiz);
  if(d==null||d<=0||a==null)return null;
  const r=a*Math.PI/180;
  return {x:Math.sin(r)*d, z:Math.cos(r)*d};
}
const HITCOL={single:'#2fbf71',double:'#3d6df0',triple:'#8b5cf6',hr:'#FA4616',out:'#ef4d5a',error:'#f2b13c'};
const TYPECOL={gb:'#f2b13c',ld:'#2fbf71',fb:'#3d6df0',pu:'#ef4d5a'};
const TYPENAME={gb:'Ground ball',ld:'Line drive',fb:'Fly ball',pu:'Pop-up'};
const ballCol=b=>HITCOL[b.result]||TYPECOL[b.btype||bucket(b.la)]||'#93a4c6';
function fieldChart(balls){
  const pts=balls.map(b=>({p:landing(b),b})).filter(o=>o.p);
  if(!pts.length)return '<div class="hint">No landing coordinates in this data.</div>';
  const W=520,H=440, hx=W/2, hy=H-28;
  const far=Math.max(...pts.map(o=>Math.hypot(o.p.x,o.p.z)));
  const fence=Math.max(300,Math.ceil(far*1.12/10)*10);        // keep it looking like a field
  // fit the whole 90-degree wedge: the foul poles are the widest point
  const k=Math.min((H-70)/fence,(W/2-14)/(fence*Math.SQRT1_2));
  const P=(x,z)=>[hx+x*k, hy-z*k];
  const pol=(d,deg)=>P(Math.sin(deg*Math.PI/180)*d, Math.cos(deg*Math.PI/180)*d);
  const L=pol(fence,-45), R=pol(fence,45);
  const arc=(d,sweep)=>{const a=pol(d,-45),b=pol(d,45);
    return `M${a[0].toFixed(1)} ${a[1].toFixed(1)} A ${(d*k).toFixed(1)} ${(d*k).toFixed(1)} 0 0 1 ${b[0].toFixed(1)} ${b[1].toFixed(1)}`};
  const baseD=Math.min(fence*0.24,70), dirtR=baseD*Math.SQRT2+18;   // dirt has to clear second base
  const b1=pol(baseD,45), b2=P(0,baseD*Math.SQRT2), b3=pol(baseD,-45), mound=P(0,baseD*0.70);
  const dots=pts.map(({p,b})=>{const [x,y]=P(p.x,p.z);
    const col=ballCol(b);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.6" fill="${col}" stroke="#0b1220" stroke-width="1.2" opacity=".95">
      <title>${(+b.ev||0).toFixed(1)} mph, ${b.la!=null?(+b.la).toFixed(0)+'°':'—'}, ${Math.round(Math.hypot(p.x,p.z))} ft${b.result?' — '+b.result:''}</title></circle>`}).join('');
  let rings='';
  for(let d=100;d<fence;d+=100)rings+=`<path d="${arc(d)}" fill="none" stroke="rgba(255,255,255,.22)" stroke-dasharray="3 5"/>

/* ============================== games (GameChanger) ==============================
   The cage tells you what he can do; the box score tells you what he did. Counting stats are
   typed in (or read off a GameChanger screenshot), everything else is derived the standard way. */
// Laid out in the same blocks GameChanger uses, so a row can be copied across in one pass.
const GSECT=[
  ['At the plate',[['gp','GP'],['pa','PA'],['ab','AB'],['h','H'],['d','2B'],['t','3B'],['hr','HR'],
                   ['rbi','RBI'],['r','R'],['bb','BB'],['k','SO'],['hbp','HBP'],['sf','SF'],['sb','SB'],['cs','CS']]],
  ['Advanced (optional)',[['qab','QAB'],['hhb','HHB'],['ldPct','LD%'],['fbPct','FB%'],['gbPct','GB%'],
                   ['cPct','C%'],['babip','BABIP'],['risp','BA/RISP'],['ps','Pitches seen'],['lob','LOB']]],
  ['Behind the plate',[['inn','Innings'],['pb','PB'],['sba','SB allowed'],['csa','CS']]],
  ['In the field',[['po','PO'],['a','A'],['e','E']]],
];
const GCOUNT=GSECT.flatMap(s=>s[1]);
function computeGame(c){
  const n=k=>num(c[k])||0;
  const ab=n('ab'), h=n('h'), bb=n('bb'), hbp=n('hbp'), sf=n('sf');
  const pa=n('pa')||(ab+bb+hbp+sf);
  const singles=Math.max(0,h-n('d')-n('t')-n('hr'));
  const tb=singles+2*n('d')+3*n('t')+4*n('hr');
  const onBase=ab+bb+hbp+sf;
  const thrown=n('csa'), stolen=n('sba');
  const chances=n('po')+n('a')+n('e');
  const s={...c, pa, tb, xbh:n('d')+n('t')+n('hr'), gp:n('gp')||1,
    avg:ab?h/ab:null, obp:onBase?(h+bb+hbp)/onBase:null, slg:ab?tb/ab:null,
    kPct:pa?n('k')/pa*100:null, bbPct:pa?bb/pa*100:null,
    qabPct:(pa&&c.qab!=null)?n('qab')/pa*100:null,
    psPA:(pa&&c.ps!=null)?n('ps')/pa:null,
    fpct:chances?(n('po')+n('a'))/chances:null,
    csPct:(thrown+stolen)?thrown/(thrown+stolen)*100:null};
  s.ops=(s.obp!=null&&s.slg!=null)?s.obp+s.slg:null;
  return s;
}
const GRATE=['ldPct','fbPct','gbPct','cPct','babip','risp'];
function sumGames(list){
  const tot={};
  GCOUNT.forEach(([k])=>{ if(GRATE.includes(k))return;
    const v=list.reduce((a,g)=>a+(num(g[k])||0),0); if(v)tot[k]=v});
  GRATE.forEach(k=>{                       // percentages: weight by plate appearances
    const have=list.filter(g=>num(g[k])!=null);
    const w=have.reduce((a,g)=>a+(num(g.pa)||1),0);
    if(have.length&&w)tot[k]=have.reduce((a,g)=>a+num(g[k])*(num(g.pa)||1),0)/w;
  });
  return computeGame(tot);
}
/* season to date, plus what the cage says he should be doing */

  return `<div class="card"><h2>Season to date</h2>
   <div class="hint">${S.length} game${S.length>1?'s':''} · ${t.pa||0} plate appearance${t.pa===1?'':'s'}</div>

     ${tile('avg','Batting average',avg3(t.avg),`${t.h||0} for ${t.ab||0}`)}

     ${t.rbi?tile('rbi','RBI',t.rbi,`${t.r||0} run${t.r===1?'':'s'} scored`):''}

/* ============================== throw-downs ==============================
   HitTrax gives the pop time and a +/- second differential against the runner, so the runner's
   own time is recoverable: runner = pop - differential. That makes the throw-down animatable as
   what it actually is — a race from the catcher's glove to the bag. */
function runnerTime(x){
  const pop=num(x.pop), d=num(x.diff);
  if(pop==null||pop<=0)return null;
  if(d==null)return null;
  const rt=pop-d;
  return (rt>1.2&&rt<4)?rt:null;
}
function basePath(){const a=+DB.player.age; return (a&&a<=12)?70:(a&&a<=14?80:90)}
const THROWVIZ={};
function throwCard(throws,id){
  const T=(throws||[]).filter(x=>throwClass(x)==='clean'&&num(x.pop)!=null);
  if(!T.length)return'';
  const prev=THROWVIZ[id]||{};
  THROWVIZ[id]={T,i:0,t:0,playing:true,only:prev.only==null?null:prev.only};
  return '<div class="card"><h2>Throw-downs to second</h2>'+
    '<div class="hint">The ball and the runner, racing on each rep — runner time comes from HitTrax’s +/- second differential. '+
    'Bases drawn at '+basePath()+' ft for this age group.</div>'+
    '<canvas id="'+id+'" width="760" height="420" style="width:100%;max-width:760px;border-radius:12px;background:#0d1526;display:block;margin:12px auto 0"></canvas>'+
    '<div class="row" style="margin-top:10px;align-items:center">'+
      '<button class="btn sec" onclick="throwReplay(\''+id+'\')">Replay</button>'+
      '<select class="inline" style="max-width:230px" onchange="throwOnly(\''+id+'\',this.value)">'+
        '<option value="">Every rep in order ('+T.length+')</option>'+
        T.map((x,i)=>'<option value="'+i+'">Rep '+(i+1)+' · pop '+(+x.pop).toFixed(2)+'s · '+(x.outcome||'—')+'</option>').join('')+
      '</select>'+
      '<span class="hint" id="'+id+'_lab'+'"></span>'+
    '</div></div>';
}
function throwReplay(id){const v=THROWVIZ[id]; if(!v)return; v.i=0; v.t=0; v.playing=true;}
function throwOnly(id,val){const v=THROWVIZ[id]; if(!v)return; v.only=(val===''?null:+val); v.i=v.only||0; v.t=0; v.playing=true;}
function throwFrame(id,dt){
  const cv=document.getElementById(id), v=THROWVIZ[id];
  if(!cv||!v)return;
  const g=cv.getContext('2d'), W=cv.width, H=cv.height;
  const bp=basePath(), toSecond=bp*Math.SQRT2;
  const idx=v.only!=null?v.only:v.i;
  const x=v.T[idx]; if(!x)return;
  const pop=+x.pop, rt=runnerTime(x), span=Math.max(pop,rt||pop)+1.1;
  if(v.playing)v.t+=dt;
  if(v.t>span){ if(v.only!=null){v.t=0} else {v.i=(v.i+1)%v.T.length; v.t=0} }
  // layout: home at the bottom, second base up the screen
  const pad=54, usable=H-pad*2, k=usable/toSecond;
  const cx=W/2-70, hy=H-pad;
  const P=(fx,fz)=>[cx+fx*k, hy-fz*k];
  const home=P(0,0), second=P(0,toSecond), first=P(bp/Math.SQRT2,toSecond/2), third=P(-bp/Math.SQRT2,toSecond/2);
  g.fillStyle='#0d1526'; g.fillRect(0,0,W,H);
  // infield
  g.beginPath(); g.moveTo(home[0],home[1]); g.lineTo(first[0],first[1]); g.lineTo(second[0],second[1]); g.lineTo(third[0],third[1]);
  g.closePath(); g.fillStyle='#2f6b3a'; g.fill(); g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=1.5; g.stroke();
  [[home,'Home'],[first,'1B'],[second,'2B'],[third,'3B']].forEach(([p,lab])=>{
    g.save(); g.translate(p[0],p[1]); g.rotate(Math.PI/4);
    g.fillStyle='#e9eefb'; g.fillRect(-5,-5,10,10); g.restore();
    g.fillStyle='rgba(233,238,251,.7)'; g.font='11px system-ui,sans-serif'; g.textAlign='center';
    g.fillText(lab,p[0],p[1]+(lab==='Home'?20:-12));});
  g.textAlign='left';
  // paths
  const dash=(a,b,col)=>{g.beginPath();g.setLineDash([5,5]);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);
    g.strokeStyle=col;g.lineWidth=1.5;g.stroke();g.setLineDash([]);};
  dash(home,second,'rgba(250,70,22,.5)'); dash(first,second,'rgba(61,109,240,.5)');
  const bProg=Math.min(1,v.t/pop), rProg=rt?Math.min(1,v.t/rt):0;
  const bp2=P(0,toSecond*bProg);
  const rp=[first[0]+(second[0]-first[0])*rProg, first[1]+(second[1]-first[1])*rProg];
  // trails
  g.beginPath(); g.moveTo(home[0],home[1]); g.lineTo(bp2[0],bp2[1]);
  g.strokeStyle='#FA4616'; g.lineWidth=3; g.stroke();
  if(rt){g.beginPath(); g.moveTo(first[0],first[1]); g.lineTo(rp[0],rp[1]);
    g.strokeStyle='#3d6df0'; g.lineWidth=3; g.stroke();}
  if(rt){g.beginPath(); g.arc(rp[0],rp[1],7,0,7); g.fillStyle='#3d6df0'; g.fill();
    g.fillStyle='#fff'; g.font='bold 9px system-ui,sans-serif'; g.textAlign='center'; g.fillText('R',rp[0],rp[1]+3); g.textAlign='left';}
  g.beginPath(); g.arc(bp2[0],bp2[1],6,0,7); g.fillStyle='#fff'; g.fill();
  g.strokeStyle='#FA4616'; g.lineWidth=2; g.stroke();
  // clock + verdict
  const panel=W-200;
  g.fillStyle='rgba(233,238,251,.9)'; g.font='bold 15px system-ui,sans-serif';
  g.fillText('Rep '+(idx+1)+' of '+v.T.length,panel,42);
  g.font='12px system-ui,sans-serif'; g.fillStyle='rgba(233,238,251,.65)';
  g.fillText('clock  '+Math.min(v.t,span).toFixed(2)+'s',panel,64);
  g.fillStyle='#FA4616'; g.fillText('ball   '+pop.toFixed(2)+'s'+(bProg>=1?'  ✓ arrived':''),panel,88);
  g.fillStyle='#3d6df0'; g.fillText('runner '+(rt?rt.toFixed(2)+'s'+(rProg>=1?'  ✓ arrived':''):'no differential'),panel,108);
  g.fillStyle='rgba(233,238,251,.6)';
  g.fillText('exchange '+(x.exch!=null?(+x.exch).toFixed(2)+'s':'—')+' · arm '+(x.velo!=null?(+x.velo).toFixed(1)+' mph':'—'),panel,132);
  if(rt&&v.t>=Math.min(pop,rt)){
    const out=pop<=rt, by=Math.abs(pop-rt);
    g.font='bold 26px system-ui,sans-serif'; g.fillStyle=out?'#2fbf71':'#ef4d5a';
    g.fillText(out?'OUT':'SAFE',panel,176);
    g.font='12px system-ui,sans-serif'; g.fillStyle='rgba(233,238,251,.7)';
    g.fillText('by '+by.toFixed(2)+'s',panel,196);
  }
  const lab=document.getElementById(id+'_lab');
  if(lab&&lab.dataset.i!==String(idx)){lab.dataset.i=String(idx);
    lab.textContent='Rep '+(idx+1)+' · pop '+pop.toFixed(2)+'s'+(rt?' vs runner '+rt.toFixed(2)+'s':'');}
}
/* Where each rep was won or lost: exchange, then ball flight, against the runner's clock. */
function throwBars(throws){
  const T=(throws||[]).filter(x=>throwClass(x)==='clean'&&num(x.pop)!=null);
  if(T.length<2)return'';
  const W=720,H=Math.min(420,46+T.length*22),P={l:40,r:92,t:26,b:22};
  const maxT=Math.max.apply(null,T.map(x=>Math.max(+x.pop,runnerTime(x)||0)))*1.06;
  const X=s=>P.l+(W-P.l-P.r)*(s/maxT);
  const rowH=(H-P.t-P.b)/T.length;
  let g='';

/* ============================== 3D flight paths ==============================
   Every batted ball carries enough to rebuild its flight: exit velocity, launch angle,
   spray direction, the contact height and HitTrax's projected distance. The arc below is
   projectile motion at the measured speed and angle, with the horizontal scaled so the ball
   lands on the distance HitTrax reported — that scale stands in for drag.
   Hand-rolled pinhole camera on a canvas: no libraries, works offline. */
const FT_PER_MPH=1.4667, G=32.17;
function trajectory(b,steps){
  const ev=num(b.ev), la=num(b.la);
  if(ev==null||ev<=0||la==null)return null;
  const v=ev*FT_PER_MPH, th=la*Math.PI/180;
  const land=landing(b);
  const phi=land?Math.atan2(land.x,Math.max(land.z,0.01))
    :(num(b.horiz)!=null?num(b.horiz)*Math.PI/180:0);
  const h0=(num(b.poiy)!=null&&+b.poiy>1)?(+b.poiy)/12:3;
  const vy=v*Math.sin(th), vh=v*Math.cos(th);
  const tf=(vy+Math.sqrt(Math.max(vy*vy+2*G*h0,0)))/G;        // time until it hits the ground
  if(!(tf>0.05))return null;
  const dist=land?Math.hypot(land.x,land.z):num(b.dist);
  const r0=vh*tf;
  const s=(dist&&r0>5)?Math.max(0.25,Math.min(1.25,dist/r0)):1;
  const n=steps||48, pts=[];
  for(let i=0;i<=n;i++){
    const tt=tf*i/n, rr=vh*tt*s;
    pts.push([rr*Math.sin(phi), Math.max(0,h0+vy*tt-0.5*G*tt*tt), rr*Math.cos(phi)]);
  }
  return {pts,tf,apex:Math.max.apply(null,pts.map(p=>p[1])),dist:dist||r0*s};
}
const CAMS={
  behind:{p:[0,55,-120],t:[0,10,190],fov:74,n:'Behind the plate'},
  side:  {p:[-260,70,90],t:[0,8,140],fov:60,n:'Third-base side'},
  high:  {p:[0,200,-60],t:[0,0,165],fov:76,n:'High home'}
};
const vsub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const vdot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const vcross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const vnorm=a=>{const m=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/m,a[1]/m,a[2]/m]};
function projector(cam,W,H){
  const f=vnorm(vsub(cam.t,cam.p)), r=vnorm(vcross([0,1,0],f)), u=vcross(f,r);
  const K=W/(2*Math.tan(cam.fov*Math.PI/360));
  return pt=>{const d=vsub(pt,cam.p), z=vdot(d,f);
    if(z<=2)return null;
    return [W/2+vdot(d,r)/z*K, H/2-vdot(d,u)/z*K, z];};
}
function arcPath(g,pr,d,step){
  g.beginPath(); let on=false;
  for(let a=-45;a<=45;a+=(step||2)){
    const p=pr([Math.sin(a*Math.PI/180)*d,0,Math.cos(a*Math.PI/180)*d]);
    if(!p){on=false;continue}
    on?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]); on=true;
  }
}
function drawField(g,pr,W,H,fence){
  const wedge=(d,fill)=>{const home=pr([0,0,0]);
    g.beginPath(); let started=false;
    if(home){g.moveTo(home[0],home[1]);started=true}
    for(let a=-45;a<=45;a+=2){const p=pr([Math.sin(a*Math.PI/180)*d,0,Math.cos(a*Math.PI/180)*d]);
      if(p){started?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);started=true}}
    g.closePath(); g.fillStyle=fill; g.fill();};
  wedge(fence,'#2b6136');
  wedge(115,'#8f6340');
  const dia=[[0,0,0],[63.6,0,63.6],[0,0,127],[-63.6,0,63.6]].map(pr);
  if(dia.every(Boolean)){g.beginPath();g.moveTo(dia[0][0],dia[0][1]);
    dia.slice(1).forEach(p=>g.lineTo(p[0],p[1]));g.closePath();g.fillStyle='#357842';g.fill();}
  for(let d=100;d<fence;d+=100){arcPath(g,pr,d);g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=1;g.stroke();}
  arcPath(g,pr,fence); g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=2; g.stroke();
  [[-45,'LF · 3B'],[45,'RF · 1B']].forEach(([a,label])=>{
    const p1=pr([0,0,0]), p2=pr([Math.sin(a*Math.PI/180)*fence,0,Math.cos(a*Math.PI/180)*fence]);
    if(p1&&p2){g.beginPath();g.moveTo(p1[0],p1[1]);g.lineTo(p2[0],p2[1]);
      g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=1.5;g.stroke();
      g.fillStyle='rgba(233,238,251,.8)'; g.font='bold 11px system-ui,sans-serif';
      g.textAlign=a<0?'right':'left';
      g.fillText(label,p2[0]+(a<0?-6:6),p2[1]-6); g.textAlign='left';}});
}
const FLIGHTS={};
let flightRAF=null;
function flightCard(balls,id,title){

  return '<div class="card"><h2>'+title+'</h2>'+

      '</select>'+

function flightCam(id,c){const f=FLIGHTS[id]; if(!f)return; f.cam=c;
  Object.keys(CAMS).forEach(k=>{const el=document.getElementById(id+'_cam_'+k); if(el)el.className=(k===c?'on':'')});}
function flightOnly(id,v){const f=FLIGHTS[id]; if(!f)return; f.only=(v===''?null:+v); f.t=0; f.playing=true;}
function flightPlay(id){const f=FLIGHTS[id]; if(!f)return; f.t=0; f.playing=true;}
function flightSetup(f){
  f.tr=f.balls.map(b=>({t:trajectory(b,48),col:ballCol(b)})).filter(x=>x.t);
  f.fence=Math.max(200,Math.ceil(Math.max.apply(null,f.tr.map(x=>x.t.dist))*1.3/10)*10);
  f.span=Math.max.apply(null,f.tr.map(x=>x.t.tf))+0.4;
}
function flightFrame(id,dt){
  const cv=document.getElementById(id), f=FLIGHTS[id];
  if(!cv||!f)return;
  if(!f.tr)flightSetup(f);
  const g=cv.getContext('2d'), W=cv.width, H=cv.height;
  if(f.playing)f.t+=dt*f.speed;
  const shown=(f.only==null?f.tr:[f.tr[f.only]]).filter(Boolean);
  const stagger=f.only==null?Math.min(0.45,2.2/Math.max(1,shown.length)):0;
  const total=f.span+stagger*shown.length;
  if(f.t>total+1.4)f.t=0;
  const grd=g.createLinearGradient(0,0,0,H); grd.addColorStop(0,'#16233c'); grd.addColorStop(1,'#0d1526');
  g.fillStyle=grd; g.fillRect(0,0,W,H);
  const pr=projector(CAMS[f.cam],W,H);
  drawField(g,pr,W,H,f.fence);
  shown.forEach((b,i)=>{
    const tt=f.t-i*stagger;
    if(tt<=0)return;
    const prog=Math.min(1,tt/b.t.tf), n=b.t.pts.length, upto=Math.max(1,Math.round(prog*(n-1)));
    g.beginPath(); let on=false;
    for(let k=0;k<=upto;k++){const p=pr(b.t.pts[k]); if(!p){on=false;continue}
      on?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]); on=true;}
    g.strokeStyle=b.col; g.globalAlpha=prog>=1?0.5:0.9; g.lineWidth=2; g.stroke(); g.globalAlpha=1;
    const head=pr(b.t.pts[upto]), gp=b.t.pts[upto], sh=pr([gp[0],0,gp[2]]);
    if(sh&&prog<1){g.beginPath();g.ellipse(sh[0],sh[1],Math.max(2,6-sh[2]/110),Math.max(1,2.4-sh[2]/320),0,0,7);
      g.fillStyle='rgba(0,0,0,.35)';g.fill();}
    if(head){
      if(prog<1){
        g.beginPath(); g.arc(head[0],head[1],Math.max(4,11-head[2]/80),0,7); g.strokeStyle=b.col; g.lineWidth=1.5; g.stroke();
        g.beginPath(); g.arc(head[0],head[1],Math.max(2.5,7-head[2]/90),0,7); g.fillStyle='#fff'; g.fill();
      } else {
        g.beginPath(); g.arc(head[0],head[1],3.5,0,7); g.fillStyle=b.col; g.fill();
      }
    }
  });
  g.fillStyle='rgba(233,238,251,.7)'; g.font='12px system-ui,sans-serif';
  g.fillText(CAMS[f.cam].n+' · fence '+f.fence+' ft',12,20);
}
function initFlights(){
  if(flightRAF){cancelAnimationFrame(flightRAF);flightRAF=null}
  // a canvas inside a closed dialog is still in the DOM — offsetParent tells us it is not on screen
  const live=id=>{const el=document.getElementById(id); return el&&el.offsetParent!==null};
  Object.keys(FLIGHTS).forEach(id=>{if(!live(id))delete FLIGHTS[id]});
  Object.keys(THROWVIZ).forEach(id=>{if(!live(id))delete THROWVIZ[id]});
  if(!Object.keys(FLIGHTS).length&&!Object.keys(THROWVIZ).length)return;
  let last=performance.now();
  const loop=now=>{
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    Object.keys(FLIGHTS).forEach(id=>flightFrame(id,dt));
    Object.keys(THROWVIZ).forEach(id=>throwFrame(id,dt));
    flightRAF=requestAnimationFrame(loop);
  };
  flightRAF=requestAnimationFrame(loop);
}
/* Save the animation as a video file. MediaRecorder off a canvas stream — supported in
   current Chrome, Edge, Firefox and Safari 14.1+; the button says so when it isn't. */
function flightRecord(id){
  const cv=document.getElementById(id), f=FLIGHTS[id], msg=document.getElementById(id+'_recmsg');
  if(!cv||!f)return;
  if(typeof MediaRecorder==='undefined'||!cv.captureStream){
    if(msg)msg.textContent='This browser can’t record canvas video — screen-record instead.';return;}
  const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
  if(!mime){if(msg)msg.textContent='No video format this browser can write.';return}
  const btn=document.getElementById(id+'_rec');
  let rec; try{rec=new MediaRecorder(cv.captureStream(30),{mimeType:mime})}
  catch(e){if(msg)msg.textContent='Recording failed to start.';return}
  const chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{
    const ext=mime.indexOf('mp4')>=0?'mp4':'webm';
    dl('hittrax-flight-'+new Date().toISOString().slice(0,10)+'.'+ext,new Blob(chunks,{type:mime}),mime);
    if(btn){btn.textContent='Save video';btn.disabled=false}
    if(msg)msg.textContent='Saved.';
  };
  f.t=0; f.playing=true;
  const shown=(f.only==null?(f.tr||[]):[1]).length||1;
  const secs=Math.min(30,(f.span||3)+0.45*shown+1.2);
  rec.start();
  if(btn){btn.textContent='Recording…';btn.disabled=true}
  if(msg)msg.textContent='Capturing '+secs.toFixed(0)+'s…';
  setTimeout(()=>{try{rec.stop()}catch(e){}},secs*1000);
}

/* ---------- strike-zone heat map ----------
   HitTrax splits the plate into 13 sections: 1-9 are the strike zone (row-major, top-left to
   bottom-right from the catcher's view) and 10-13 are the four out-of-zone quadrants. The
   vertical tiers are unambiguous in the exports (zone 11 sits high, 12/13 low, 1-3 top row,
   4-6 middle, 7-9 bottom); left/right is inferred, so every cell is labelled with its number. */
const ZGRID=[[1,2,3],[4,5,6],[7,8,9]], ZOUT={10:'tl',11:'tr',12:'bl',13:'br'};
const ZMETRICS={avgEV:'Avg exit velo',hha:'Hard-hit %',avg:'Batting avg',count:'Balls'};
let ZM='avgEV';
/* The facility's plate reference can sit off-centre, which shows up as every pitch landing in
   one column with nothing down the middle. This remaps the zone number for display only — the
   measurements are untouched, and it is off unless the user has verified the offset at the cage. */
const MIRROR={1:3,2:2,3:1,4:6,5:5,6:4,7:9,8:8,9:7,10:11,11:10,12:13,13:12};
const SHIFT={'-1':{3:2,2:1,6:5,5:4,9:8,8:7},'1':{1:2,2:3,4:5,5:6,7:8,8:9}};
function zoneFix(z){
  z=num(z); if(z==null)return null;
  const c=DB.settings.zoneCal||'none';
  if(c==='mirror')return MIRROR[z]!=null?MIRROR[z]:z;
  if(c==='left'||c==='right'){const m=SHIFT[c==='left'?'-1':'1']; return m[z]!=null?m[z]:z}
  return z;
}
const zoneCalLabel=()=>({none:'',mirror:'left/right mirrored',left:'shifted one column left',right:'shifted one column right'})[DB.settings.zoneCal||'none'];
// how lopsided is the pitch feed? the honest read on a shifted-looking zone
function zoneBalance(balls){
  const zs=balls.map(b=>zoneFix(b.zone)).filter(z=>z!=null);
  if(zs.length<8)return null;
  const col=z=>[1,4,7,10,12].includes(z)?'L':([3,6,9,11,13].includes(z)?'R':'C');
  const n={L:0,C:0,R:0}; zs.forEach(z=>n[col(z)]++);
  const inZone=zs.filter(z=>z>=1&&z<=9).length;
  return {n:zs.length,L:n.L,C:n.C,R:n.R,inZone,
    lop:Math.max(n.L,n.R)/zs.length*100, side:n.R>=n.L?'right':'left'};
}
function zoneAgg(balls){
  const by={};
  balls.forEach(b=>{const z=zoneFix(b.zone); if(z==null)return;
    (by[z]=by[z]||[]).push(b)});
  const out={};
  Object.keys(by).forEach(z=>{const g=by[z], evs=g.map(x=>+x.ev), o=outcomeLine(g);
    out[z]={count:g.length, avgEV:evs.reduce((a,c)=>a+c,0)/g.length,
            hha:g.filter(x=>+x.ev>=HH()).length/g.length*100,

}

    :(ZM==='avg'?(a.avg==null?'—':avg3(a.avg)):a.avgEV.toFixed(1)));

  const W=380,H=420, mx=72,my=74, iw=W-2*mx, ih=H-2*my;
  // label a cell: value + sample size, dimmed when there are too few balls to mean anything
  const text=(z,cx,cy,big)=>{const a=agg[z]; if(!a)return'';
    const thin=a.count<3;
    return `<text x="${cx}" y="${cy+1}" text-anchor="middle" font-size="${big?16:13}" font-weight="800"
      fill="#fff" opacity="${thin?.75:1}">${val(a)}</text>
      <text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,.75)">${a.count} ball${a.count>1?'s':''}</text>`};
  const num=(z,x,y)=>`<text x="${x}" y="${y}" font-size="9" fill="rgba(255,255,255,.45)" font-weight="700">${z}</text>`;
  // four out-of-zone quadrants, drawn as a ring so the strike zone sits in a hole, not on top

function mixBar(s){

function dashPick(){
  const E=dashEntries(); if(!E.length)return null;

function dashPicker(){
