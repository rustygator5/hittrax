// where the pop time actually goes: glove-to-hand exchange vs. ball flight
function popSplit(st){
  const pop=num(st.avgPop), ex=num(st.avgExch);
  if(pop==null||ex==null||ex>=pop)return'';
  const flight=pop-ex, exPct=ex/pop*100;
  return `<div style="margin-top:14px"><label>Where the pop time goes</label>
   <div style="display:flex;height:26px;border-radius:8px;overflow:hidden;border:1px solid var(--line)">
     <div style="width:${exPct}%;background:#f2b13c;display:grid;place-items:center;font-size:11px;font-weight:800;color:#0b1220">${ex.toFixed(2)}s</div>
     <div style="width:${100-exPct}%;background:#3d6df0;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff">${flight.toFixed(2)}s</div>
   </div>
   <div class="legend"><span><i style="background:#f2b13c"></i>Exchange ${Math.round(exPct)}%</span>
     <span><i style="background:#3d6df0"></i>Ball flight ${Math.round(100-exPct)}% — arm strength</span></div></div>`;
}
function popBenchCard(st,b){
  const v=num(st.bestPop)!=null?num(st.bestPop):num(st.avgPop); if(v==null)return'';
  const lo=Math.min(b.elite-0.15,v-0.05), hi=Math.max(b.avg[1]+0.2,v+0.05);
  const pct=x=>Math.max(0,Math.min(100,(x-lo)/(hi-lo)*100));
  let tag='Developing',cls='r';
  if(v<=b.elite){tag='Elite range';cls='g'}
  else if(v<=b.good){tag='Above average';cls='g'}
  else if(v<=b.avg[1]){tag='In the average band';cls='a'}
  return `<div class="card"><div class="row" style="align-items:center">
    <div><h2>Age benchmark <span class="chip">${b.label}</span></h2>
    <div class="hint">Best pop time to 2B vs. typical ranges for this age — lower is better</div></div>
    <span class="chip ${cls}" style="margin-left:auto">${tag}</span></div>
    <div style="position:relative;height:56px;margin-top:6px">
      <div style="position:absolute;top:18px;left:0;right:0;height:14px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden">
        <div style="position:absolute;left:${pct(b.avg[0])}%;width:${pct(b.avg[1])-pct(b.avg[0])}%;top:0;bottom:0;background:rgba(242,177,60,.35)"></div>
        <div style="position:absolute;left:${pct(b.elite)}%;width:${pct(b.good)-pct(b.elite)}%;top:0;bottom:0;background:rgba(47,191,113,.35)"></div>
        <div style="position:absolute;left:0;width:${pct(b.elite)}%;top:0;bottom:0;background:rgba(47,191,113,.6)"></div>
      </div>
      <div style="position:absolute;left:${pct(v)}%;top:8px;transform:translateX(-50%);text-align:center">
        <div style="width:3px;height:34px;background:var(--orange);margin:0 auto;border-radius:2px"></div>
        <div style="font-size:12px;font-weight:800;color:var(--orange);margin-top:2px">${v.toFixed(2)}</div>
      </div>
    </div>
    <div class="legend" style="margin-top:16px"><span><i style="background:rgba(47,191,113,.85)"></i>Elite ${b.elite.toFixed(2)} or quicker</span>
      <span><i style="background:rgba(47,191,113,.5)"></i>Good up to ${b.good.toFixed(2)}</span>
      <span><i style="background:rgba(242,177,60,.6)"></i>Average ${b.avg[0].toFixed(2)}–${b.avg[1].toFixed(2)}</span></div>
  </div>`;
}
function benchCard(st,b){
  const v=num(st.maxEV); if(v==null)return'';
  const hi=Math.max(b.elite+6,v+3), lo=Math.max(20,b.avg[0]-12);
  const pct=x=>Math.max(0,Math.min(100,(x-lo)/(hi-lo)*100));
  let tag='Building', cls='r';
  if(v>=b.elite){tag='Elite range';cls='g'}
  else if(v>=b.good[0]){tag='Above average';cls='g'}
  else if(v>=b.avg[0]){tag='In the average band';cls='a'}
  return `<div class="card"><div class="row" style="align-items:center">
    <div><h2>Age benchmark <span class="chip">${b.label}</span></h2>
    <div class="hint">Max exit velo vs. typical ranges for this age (controlled/tee conditions)</div></div>
    <span class="chip ${cls}" style="margin-left:auto">${tag}</span></div>
    <div style="position:relative;height:56px;margin-top:6px">
      <div style="position:absolute;top:18px;left:0;right:0;height:14px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden">
        <div style="position:absolute;left:${pct(b.avg[0])}%;width:${pct(b.avg[1])-pct(b.avg[0])}%;top:0;bottom:0;background:rgba(242,177,60,.35)"></div>
        <div style="position:absolute;left:${pct(b.good[0])}%;width:${pct(b.good[1])-pct(b.good[0])}%;top:0;bottom:0;background:rgba(47,191,113,.35)"></div>
        <div style="position:absolute;left:${pct(b.elite)}%;right:0;top:0;bottom:0;background:rgba(47,191,113,.6)"></div>
      </div>
      <div style="position:absolute;left:${pct(v)}%;top:8px;transform:translateX(-50%);text-align:center">
        <div style="width:3px;height:34px;background:var(--orange);margin:0 auto;border-radius:2px"></div>
        <div style="font-size:12px;font-weight:800;color:var(--orange);margin-top:2px">${v.toFixed(1)}</div>
      </div>
    </div>
    <div class="legend" style="margin-top:16px"><span><i style="background:rgba(242,177,60,.6)"></i>Average ${b.avg[0]}–${b.avg[1]}</span>
      <span><i style="background:rgba(47,191,113,.5)"></i>Good ${b.good[0]}–${b.good[1]}</span>
      <span><i style="background:rgba(47,191,113,.85)"></i>Elite ${b.elite}+</span></div>
  </div>`;
}
function coachCard(S){
  if(S.length<2)return `<div class="card note">Log a second session and this panel starts calling out what moved —
   and what to work on next.</div>`;
  const cat=VIEWKIND==='catching';
  const good=[],work=[];
  (cat?['bestPop','avgPop','avgExch','maxVelo','avgVelo','onTarget','outPct']
      :['maxEV','avgEV','hha','sweet','ld','gb','avgLA','barrel']).forEach(k=>{
    const Sr=series(k); if(Sr.length<3)return;
    const half=Math.max(1,Math.floor(Sr.length/2));
    const early=Sr.slice(0,half), late=Sr.slice(-half);
    const a=early.reduce((x,c)=>x+c.v,0)/early.length, b2=late.reduce((x,c)=>x+c.v,0)/late.length;
    const floor=MK[k].u==='%'?2:(MK[k].u==='s'?0.03:0.6);
    const d=b2-a; if(Math.abs(d)<floor)return;
    const cls=dirClass(k,d);
    const txt=`<b>${MK[k].n}</b> ${d>0?'up':'down'} ${Math.abs(d).toFixed(MK[k].d)}${MK[k].u} (first half ${fmt(k,a)} → recent ${fmt(k,b2)})`;
    (cls==='up'?good:work).push(txt);
  });
  const st=sessionStats(S[S.length-1]);
  const cues=[];
  if(cat){
    const pop=num(st.avgPop), ex=num(st.avgExch), v=num(st.avgVelo), ot=num(st.onTarget);
    if(pop!=null&&ex!=null&&ex>=0.95)cues.push('Exchange is the slow part ('+ex.toFixed(2)+'s). Footwork and glove-to-hand drills buy more pop time than arm work right now.');
    if(pop!=null&&ex!=null&&ex<0.80&&v!=null)cues.push('Exchange is already quick ('+ex.toFixed(2)+'s) — the rest of the pop time is ball flight, so arm strength is the lever.');
    if(ot!=null&&ot<60)cues.push('Under 60% of throws are on the bag. A fast throw nobody catches is not a fast throw — chase accuracy before velo.');
    if(ot!=null&&ot>=85&&v!=null)cues.push('Accuracy is locked in — safe to push throw velocity without giving the base away.');
    const spread=num(st.avgPop)!=null&&num(st.bestPop)!=null?num(st.avgPop)-num(st.bestPop):null;
    if(spread!=null&&spread>0.18)cues.push('Big gap between best and average pop ('+spread.toFixed(2)+'s) — the quick one is in there, repeating it is the work.');
    return coachBody(good,work,cues);
  }
  if(num(st.gb)>=45)cues.push('Ground-ball rate is high — the barrel is working down through the zone. Drill: high-tee / top-half contact work.');
  if(num(st.pu)>=15)cues.push('Pop-ups are up — usually early bat-head release or too steep. Drill: line-drive-only rounds off the tee.');
  if(num(st.sweet)!=null&&num(st.sweet)<45)cues.push('Under half the batted balls are in the 8–32° window. Chase sweet-spot % before chasing max velo.');
  if(num(st.avgEV)!=null&&num(st.maxEV)!=null&&num(st.maxEV)-num(st.avgEV)>15)cues.push('Big gap between max and average EV — the power is there, consistency of contact is the gap.');
  if(num(st.ld)>=25&&num(st.hha)>=40)cues.push('Line-drive rate and hard-hit rate are both strong — this is the profile you want to repeat.');
  return coachBody(good,work,cues);
}
function coachBody(good,work,cues){
  return `<div class="card"><h2>What's moving</h2><div class="hint">First half of your logged sessions vs. the most recent half</div>
   ${good.length?'<div style="margin-top:6px"><span class="chip g">Improving</span><ul class="tight">'+good.map(t=>'<li>'+t+'</li>').join('')+'</ul></div>':''}
   ${work.length?'<div style="margin-top:12px"><span class="chip a">Watch</span><ul class="tight">'+work.map(t=>'<li>'+t+'</li>').join('')+'</ul></div>':''}
   ${!good.length&&!work.length?'<div class="hint">No trend big enough to call yet — keep logging.</div>':''}
   ${cues.length?'<div style="margin-top:14px"><span class="chip">Cues from the last session</span><ul class="tight">'+cues.map(t=>'<li>'+t+'</li>').join('')+'</ul></div>':''}
  </div>`;
}
function pbCard(){
  const rows=KIND[VIEWKIND].metrics.filter(m=>m.dir==='up'||m.dir==='down').map(m=>{
    const b=best(m.k); if(!b)return'';
    return `<tr><td>${m.n}</td><td style="font-weight:800">${fmt(m.k,b.v)} ${m.u}</td><td style="color:var(--dim)">${b.date}</td></tr>`;
  }).filter(Boolean).join('');
  if(!rows)return'';
  return `<div class="card"><h2>Personal bests</h2><div class="hint">Best single-session value for each metric</div>
   <div class="scroll"><table><thead><tr><th>Metric</th><th>Best</th><th>Set on</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function refCard(){
  if(VIEWKIND==='catching')return `<div class="card"><h2>What the catching module gives you</h2>
  <div class="hint">HitTrax measures the throw to second; everything below can be tracked here, per throw or per session.</div>
  <ul class="tight">
   <li><b>Pop time</b> — glove impact to the ball reaching the centre of 2B, from the measured throw velocity</li>
   <li><b>Exchange (transfer) time</b> — receiving the ball to releasing it; the half of pop time footwork actually controls</li>
   <li><b>Arm strength</b> — peak velocity of the throw, measured just after release</li>
   <li><b>Throw accuracy</b> — how far off the bag it finished, plus HitTrax's projected out / safe outcome and the time differential</li>
  </ul></div>`;
  return `<div class="card"><h2>What HitTrax gives you</h2>
  <div class="hint">Everything below can be logged here — per session, and per batted ball if you have the detail rows.</div>
  <ul class="tight">
   <li><b>Per batted ball:</b> exit velocity, launch angle, projected distance, point of impact, horizontal/spray angle, pitch speed, play outcome</li>
   <li><b>Session summary:</b> max &amp; average exit velo, average launch angle, average &amp; max distance, hard-hit average, line-drive / fly-ball / ground-ball %, batting average, slugging</li>
   <li><b>Charts:</b> spray chart, strike-zone map, launch angle vs. exit velo, launch angle vs. distance, LA vs. BA/SLG</li>
  </ul></div>`;
}

function setupDrop(){

  ['dragenter','dragover'].forEach(e=>z.addEventListener(e,ev=>{ev.preventDefault();z.classList.add('over')}));
  ['dragleave','drop'].forEach(e=>z.addEventListener(e,ev=>{ev.preventDefault();z.classList.remove('over')}));
  z.addEventListener('drop',ev=>{const f=ev.dataTransfer&&ev.dataTransfer.files[0]; if(f)readCsv(f)});
}
let RAWNAME=null;
function readCsv(file){
  if(!file)return;
  RAWNAME=file.name;
  if(file.size>8*1024*1024){alert('That file is over 8 MB — is it really a HitTrax CSV?');return}
  const r=new FileReader();
  r.onload=()=>{
    RAW=String(r.result||'');
    const ta=document.getElementById('f_paste');
    // very large exports stay out of the textarea (slow to render) but still parse in full
    if(ta)ta.value=RAW.length<=40000?RAW:'';
    const fn=document.getElementById('fileName');
    if(fn)fn.innerHTML=`<span class="chip g">${esc(file.name)}</span> ${(file.size/1024).toFixed(0)} KB`
      +(RAW.length>40000?' — too big to show here, parsed straight from the file':'');
    doParse();
  };
  r.onerror=()=>alert('Could not read that file.');
  r.readAsText(file);
}
function doParse(){

function avgPitch(balls){
  const p=balls.map(b=>+b.pitch).filter(v=>v>0&&v<130);
  return p.length?Math.round(p.reduce((a,c)=>a+c,0)/p.length):null;
}
function showPitch(rows){
  const el=document.getElementById('pitchAuto'); if(!el)return;
  const p=avgPitch(rows), ps=rows.map(r=>num(r.pitch)).filter(v=>v>0);
  el.innerHTML=p==null?'<span>No pitch speed in this file</span>'
    :`<b>${p}</b><span>mph avg${ps.length>1?` · ${Math.min(...ps).toFixed(0)}–${Math.max(...ps).toFixed(0)} range`:''}</span>`;
}
function groupByDate(){
  const g={}; PARSED.forEach(b=>{const d=b.date||'(no date)'; (g[d]=g[d]||[]).push(b)});
  return Object.keys(g).sort().map(d=>({date:d,balls:g[d]}));
}
// the export names the player and level — fill a blank profile rather than make them retype it
function prefillPlayer(rows){
  const r=rows.find(x=>x.user)||{};
  if(r.user&&!DB.player.name){DB.player.name=(''+r.user).trim(); save()}
  const lv=(rows.find(x=>x.level)||{}).level;
  if(lv&&!DB.player.level){DB.player.level=(''+lv).trim(); save()}
  // "Baseball - 12U" -> age 12 (top of the bracket; editable on the Player tab)
  if(lv&&!DB.player.age){const m=(''+lv).match(/(\d{1,2})\s*U/i); if(m){DB.player.age=String(+m[1]); save()}}
}
function doParseThrows(txt){

     <span class="mono">${UNMAPPED.map(esc).join(', ')}</span>. Send me that header row and I'll teach the app its names.</div>`:'';
    return}
  if(PDATES.length){const d=document.getElementById('f_date'); if(d)d.value=PDATES[0]}

     if(s.misfires)bad.push(`${s.misfires} misfire${s.misfires>1?'s':''} (pop outside ${CLEAN.popLo}–${CLEAN.popHi}s)`);
     if(s.nothrows)bad.push(`${s.nothrows} rep${s.nothrows>1?'s':''} with no throw logged`);
     return bad.length?` — ${s.throws} of ${s.attempts} reps clean; ${bad.join(' and ')} counted in Clean Rep % but kept out of the averages`:''})()}${multi?' · all dates combined':''}</div>
   <div class="tiles">`+['throws','bestPop','avgPop','avgExch','maxVelo','avgVelo','cleanPct','outPct','onTarget','avgDiff'].map(k=>
     st[k]==null?'':`<div class="tile" style="background:var(--bg2)"><div class="k">${MK[k].n}</div>
       <div class="v" style="font-size:21px">${fmt(k,st[k])}<small>${MK[k].u}</small></div></div>`).join('')+
   `</div>${popSplit(st)}
   ${UNMAPPED.length?`<div class="note warn" style="margin-top:12px">Ignored columns: <span class="mono">${UNMAPPED.map(esc).join(', ')}</span></div>`:''}
   ${multi?`<div class="note" style="margin-top:14px">
      <label style="display:flex;align-items:center;gap:9px;text-transform:none;letter-spacing:0;font-size:13.5px;color:inherit;font-weight:600">
        <input type="checkbox" id="f_split" checked style="width:auto" onchange="renderSplit()">
        Save as ${PDATES.length} separate sessions, one per date</label>

  if(multi)renderSplit();

function renderSplit(){
  const el=document.getElementById('splitList'); if(!el)return;
  const on=document.getElementById('f_split').checked, cat=LOGKIND==='catching';
  if(!on){el.innerHTML=`<span class="hint">One session dated by the date field above, with all ${PARSED.length} ${cat?'throws':'batted balls'}.</span>`;return}

      const s=computeFromBalls(g.balls,HH());
      return `<tr><td>${g.date}</td><td>${s.swings}</td><td>${fmt('maxEV',s.maxEV)}</td><td>${fmt('avgEV',s.avgEV)}</td></tr>`}).join('')+
    `</tbody></table></div>`;

// Same date, same number of rows, same first and last ball: that's the same export again.
function roundSig(kind,date,rows){
  const f=rows[0]||{}, l=rows[rows.length-1]||{};
  const n=v=>v==null?'-':(+v).toFixed(2);
  return [kind,date,rows.length,n(f.ev||f.pop),n(f.la||f.velo),n(l.ev||l.pop),n(l.la||l.velo)].join('|');
}
function findSameRound(kind,date,rows){
  return DB.sessions.find(s=>kindOf(s)===kind&&s.date===date&&
    roundSig(kind,s.date,(kind==='catching'?s.throws:s.balls)||[])===roundSig(kind,date,rows));
}
/* ---------- stored source files + backfill ---------- */
const MAXFILE=1200000;                       // ~1.2 MB of CSV is already a huge session
function storeFile(name,text){
  if(!text||text.length>MAXFILE)return null;
  const id=uid();
  DB.files=DB.files||{};
  DB.files[id]={name:name||'pasted rows',text,ts:Date.now()};
  return id;
}
function fileBytes(){return Object.values(DB.files||{}).reduce((a,f)=>a+(f.text||'').length,0)}
function pruneFiles(){                       // drop files no session points at any more
  const used=new Set(DB.sessions.map(s=>s.src&&s.src.f).filter(Boolean));
  Object.keys(DB.files||{}).forEach(id=>{if(!used.has(id))delete DB.files[id]});
}
// Re-read a round from the file it came from, so new columns appear without a re-upload.
function backfillSession(s){
  const f=s.src&&DB.files&&DB.files[s.src.f]; if(!f)return false;
  const cat=kindOf(s)==='catching';
  const r=cat?parseThrows(f.text):parsePaste(f.text);
  let rows=cat?r.throws:r.balls;
  if(!rows.length)return false;
  if(r.dates.length>1&&s.src.date)rows=rows.filter(x=>x.date===s.src.date);
  const had=((cat?s.throws:s.balls)||[]).length;
  if(!rows.length||(had&&Math.abs(rows.length-had)>Math.max(2,had*0.1)))return false;  // not the same round
  const before=JSON.stringify(cat?s.throws:s.balls);
  if(cat){s.throws=rows; s.summary=computeFromThrows(rows)}
  else{s.balls=rows; s.summary=computeFromBalls(rows,HH())}
  const ap=avgPitch(rows); if(ap!=null)s.pitch=ap;
  const changed=JSON.stringify(cat?s.throws:s.balls)!==before;
  if(changed)s.mtime=Date.now();
  return changed;
}
function backfillAll(){
  let n=0; DB.sessions.forEach(s=>{if(backfillSession(s))n++});
  return n;
}
function saveSession(){
  const g=id=>document.getElementById(id);
  const cat=LOGKIND==='catching';
  const pitchEl=g('f_pitch');
  const s={id:uid(),kind:LOGKIND,date:g('f_date').value,type:g('f_type').value,pitch:pitchEl?num(pitchEl.value):null,
    location:g('f_loc').value.trim(),notes:g('f_notes').value.trim(),mode:LOGMODE};
  if(!s.date){alert('Pick a date.');return}
  const pack=(rows)=>Object.assign(cat?{throws:rows,summary:computeFromThrows(rows)}
                        :{balls:rows,summary:computeFromBalls(rows,HH())},{pitch:avgPitch(rows)});
  if(LOGMODE==='detail'&&LOGKIND!=='games'){
    if(!PARSED.length)doParse();
    if(!PARSED.length){alert('Nothing parsed yet — upload a CSV or paste rows, then hit Parse.');return}
    const splitBox=document.getElementById('f_split');
    if(splitBox&&splitBox.checked){        // one session per date in the file
      const groups=groupByDate(), now=Date.now(); let fresh=0,again=0;
      const fid=storeFile(RAWNAME,RAW!=null?RAW:(g('f_paste')||{}).value);
      groups.forEach((gr,i)=>{
        const date=gr.date==='(no date)'?s.date:gr.date, d=pack(gr.balls);
        const pitch=s.pitch!=null?s.pitch:(d.pitch!=null?d.pitch:null);
        const src=fid?{f:fid,date:groups.length>1?date:null}:null;
        const dupe=findSameRound(LOGKIND,date,gr.balls);
        if(dupe){Object.assign(dupe,d,{pitch,mtime:now+i},src?{src}:{});again++}
        else{DB.sessions.push({...s,...d,id:uid(),mtime:now+i,pitch,date,src});fresh++}});
      pruneFiles();
      save(); clearParse(); VIEWKIND=LOGKIND;
      alert(savedMsg(fresh,again)); go('sessions'); return;
    }
    Object.assign(s,pack(PARSED));   // pitch speed comes from the file
  }else if(LOGKIND==='games'){
    const sum={}; let any=false;
    GCOUNT.forEach(([k])=>{const e=document.getElementById('s_'+k); if(!e)return;
      const v=num(e.value); if(v!=null){sum[k]=v;any=true}});
    if(!any){alert('Enter at least one number from the box score.');return}
    s.summary=sum; s.mode='game';
  }else{
    const sum={}; let any=false;
    KIND[LOGKIND].metrics.forEach(m=>{const e=document.getElementById('s_'+m.k); if(!e)return;
      const v=num(e.value); if(v!=null){sum[m.k]=v;any=true}});
    if(!any){alert('Enter at least one number.');return}
    ['hha','onTarget','outPct'].forEach(k=>{if(sum[k]!=null&&sum[k]<=1)sum[k]*=100});   // accept .450 or 45
    s.summary=sum;
  }
  s.mtime=Date.now();
  // the same export again? refresh that round in place rather than logging it twice
  const rows=LOGMODE==='detail'?PARSED:null;
  if(rows){const fid=storeFile(RAWNAME,RAW!=null?RAW:(g('f_paste')||{}).value); if(fid)s.src={f:fid,date:null}}
  const dupe=rows?findSameRound(LOGKIND,s.date,rows):null;
  if(dupe){Object.assign(dupe,pack(rows),{mtime:Date.now()},s.src?{src:s.src}:{});
    if(s.notes)dupe.notes=s.notes;
    pruneFiles();
    save(); clearParse(); VIEWKIND=LOGKIND;
    alert('That round was already logged — refreshed it in place (outcomes and all) instead of adding a duplicate.');
    go('dash'); return;}
  DB.sessions.push(s); pruneFiles(); save(); clearParse(); VIEWKIND=LOGKIND; go('dash');
}
function savedMsg(fresh,again){
  const bits=[];
  if(fresh)bits.push(`Saved ${fresh} session${fresh>1?'s':''}`);
  if(again)bits.push(`refreshed ${again} already logged`);
  return bits.join(' · ')+'.';
}

      return `<td${i===1?' style="font-weight:700"':''}>${v==null?'—':(MK[c[0]].u==='%'?Math.round(v)+'%':fmt(c[0],v))}</td>`}).join('')+
    `<td>${(s.parts&&s.parts.length>1)?`<span class="chip">${s.parts.length} rounds</span>`
      :(s.mode==='detail'?'<span class="chip">detail</span>':'')}</td></tr>`}).join('')+
  `</tbody></table></div></div>`+excludedCard();

// Session type is editable after the fact — HitTrax doesn't record it, so it's guesswork at
// upload time. Editing a grouped day retypes every round in it.
function typeSelect(s,small){
  const list=STYPES[kindOf(s)].slice();
  if(s.type&&!list.includes(s.type))list.unshift(s.type);     // e.g. a merged "Front toss + Tee"
  return `<select class="inline${small?' sm':''}" onclick="event.stopPropagation()"
    onchange="event.stopPropagation();setType('${s.id}',this.value)">
    ${!s.type?'<option value="" selected>—</option>':''}
    ${list.map(o=>`<option${o===s.type?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
}
function setType(id,val){
  const s=findSession(id); if(!s)return;
  (s.parts||[s]).forEach(pt=>{const raw=DB.sessions.find(x=>x.id===pt.id); if(raw){raw.type=val;raw.mtime=Date.now()}});
  save(); render();
  if(dlg.open&&OPENID)openSession(OPENID);   // keep an open breakdown in step
}
function excludedCard(){
  const ex=excludedOf(VIEWKIND); if(!ex.length)return'';

      </select></td></tr>`}).join('')+
   `</tbody></table></div></div>`;
}

// Rounds on the same date can come from different pitchers — the pitch speed and exit velo
// per round make that obvious, and each round can be grouped, kept separate or excluded.
function roundsTable(s,id){
  const rounds=roundsOfDate(s), cat=kindOf(s)==='catching';
  if(rounds.length<2)
    return `<div class="row" style="margin-top:18px"><button class="btn ghost" onclick="delSession('${id}')"
      style="color:var(--red);border-color:rgba(239,77,90,.4)">Delete session</button></div>`;
  const head=cat?['Round','Throws','Pitch in','Avg pop']:['Round','Balls','Avg pitch','Avg EV'];
  return `<div style="margin-top:18px"><label>${rounds.length} rounds logged on ${esc(s.date)}</label>
    <div class="hint" style="margin:-4px 0 8px">Different pitcher or machine setting? Keep that round separate so its
      numbers don't average into the rest of the day — or drop it out of the totals entirely.</div>
    <div class="scroll"><table><thead><tr>${head.map(h=>'<th>'+h+'</th>').join('')}<th>Type</th><th>Counts as</th><th></th></tr></thead><tbody>`+
    rounds.map((pt,i)=>{
      const st=sessionStats(pt), d=dispo(pt), n=((cat?pt.throws:pt.balls)||[]).length;
      const ks=cat?['avgPop','maxVelo']:['avgEV','maxEV'];
      const here=pt.id===id||(s.parts||[]).some(x=>x.id===pt.id);
      return `<tr style="${d==='out'?'opacity:.5':''}">
        <td>#${i+1}${here?'':' <span class="chip" style="font-size:9px">other</span>'}</td>
        <td>${n||'—'}</td>
        <td>${pt.pitch!=null?Math.round(pt.pitch)+'<small style="color:var(--dim)"> mph</small>':'—'}</td>
        <td style="font-weight:700">${fmt(ks[0],num(st[ks[0]]))}</td>
        <td>${typeSelect(pt,true)}</td>
        <td><select class="inline sm" onchange="setGroup('${pt.id}',this.value)">
          ${Object.keys(GROUPS).map(g=>`<option value="${g}"${g===d?' selected':''}>${GROUPS[g]}</option>`).join('')}
        </select></td>
        <td><button class="btn ghost" style="padding:4px 10px;font-size:12px;color:var(--red);border-color:rgba(239,77,90,.4)"
          onclick="delSession('${pt.id}')">Delete</button></td></tr>`}).join('')+
    `</tbody></table></div></div>`;
}
function delSession(id){
  if(!confirm('Delete this round? This cannot be undone.'))return;
  OPENID=null;
  DB.sessions=DB.sessions.filter(s=>s.id!==id);
  DB.deleted.push({id,ts:Date.now()});      // tombstone, so the delete syncs instead of the row coming back
  pruneFiles();
  save(); dlg.close(); render();
}

function vReport(){

    const f=s2[0].v,l=s2[s2.length-1].v,d=l-f,bs=best(m.k);
    const pct=f?((d/Math.abs(f))*100):null;
    return `<tr><td>${m.n}</td><td>${fmt(m.k,f)}</td><td style="font-weight:700">${fmt(m.k,l)}</td>

      <tbody>${rows}</tbody></table></div>
    ${b?`<div class="note" style="margin-top:14px">Age-group reference (${b.label}): ${cat
      ?`pop time average ${b.avg[0].toFixed(2)}–${b.avg[1].toFixed(2)}s · good ${b.good.toFixed(2)}s · elite ${b.elite.toFixed(2)}s or quicker.`
      :`average ${b.avg[0]}–${b.avg[1]} mph · good ${b.good[0]}–${b.good[1]} mph · elite ${b.elite}+ mph max exit velo.`}</div>`:''}
   </div>
   ${cat?'':(()=>{const balls=S.flatMap(x=>x.balls||[]);
     return thirdsCard(balls,`across ${S.length} session${S.length>1?'s':''}`)+zoneCard(balls,`across ${S.length} session${S.length>1?'s':''}`);})()}
   ${cat?`<div class="card"><h2>Average pop time</h2>${lineChart(series('avgPop'),'avgPop',b?{band:[b.elite,b.good]}:{})}</div>
     <div class="card"><h2>Arm strength</h2>${lineChart(series('maxVelo'),'maxVelo')}</div>`
   :`<div class="card"><h2>Max exit velo</h2>${lineChart(series('maxEV'),'maxEV',b?{band:[b.good[0],b.good[1]]}:{})}</div>
     <div class="card"><h2>Hard-hit average</h2>${lineChart(series('hha'),'hha')}</div>`}
   <div class="card"><h2>Session log</h2><div class="scroll"><table><thead><tr><th>Date</th><th>Type</th>
     <th>${cat?'Throws':'BIP'}</th><th>${cat?'Best pop':'Max EV'}</th><th>${cat?'Avg pop':'Avg EV'}</th><th>Notes</th></tr></thead><tbody>`+
   S.slice().reverse().map(s=>{const st=sessionStats(s); const ks=cat?['throws','bestPop','avgPop']:['swings','maxEV','avgEV'];
     return `<tr><td>${s.date}</td><td>${esc(s.type||'')}</td><td>${num(st[ks[0]])!=null?Math.round(st[ks[0]]):'—'}</td>
      <td>${fmt(ks[1],num(st[ks[1]]))}</td><td>${fmt(ks[2],num(st[ks[2]]))}</td>
      <td style="white-space:normal;color:var(--dim);max-width:280px">${esc(s.notes||'')}</td></tr>`}).join('')+
   `</tbody></table></div></div>`;
}
function copyReport(){
  const S=sorted(); let t=`${DB.player.name||'Player'} — HitTrax progress\n${S[0].date} → ${S[S.length-1].date} · ${S.length} sessions\n\n`;
  KIND[VIEWKIND].metrics.forEach(m=>{const s2=series(m.k); if(s2.length<2)return;
    const f=s2[0].v,l=s2[s2.length-1].v;
    t+=`${m.n}: ${fmt(m.k,f)} → ${fmt(m.k,l)} (${dstr(m.k,l-f)}${m.u})\n`});
  navigator.clipboard.writeText(t).then(()=>alert('Report copied.'),()=>alert('Copy failed.'));
}

function reparseNow(){

function dropFiles(){

function dl(name,text,type){
  const blob=(text instanceof Blob)?text:new Blob([text],{type});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function expJSON(){dl(`hittrax-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(DB,null,2),'application/json')}
function expCSV(){
  const ks=KIND[VIEWKIND].metrics.map(m=>m.k);
  let csv='date,type,location,pitch_speed,'+ks.join(',')+',notes\n';
  sorted().forEach(s=>{const st=sessionStats(s);
    csv+=[s.date,s.type||'',s.location||'',s.pitch||''].map(v=>`"${(''+v).replace(/"/g,'""')}"`).join(',')+','+
      ks.map(k=>num(st[k])!=null?(+st[k]).toFixed(MK[k].d):'').join(',')+
      `,"${(s.notes||'').replace(/"/g,'""')}"\n`});
  dl(`hittrax-${VIEWKIND}-${new Date().toISOString().slice(0,10)}.csv`,csv,'text/csv');
}
function impJSON(inp){
  const f=inp.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!d.sessions)throw new Error('Not a tracker backup');
    if(!confirm(`Import ${d.sessions.length} sessions? They merge in with what's already here — nothing is replaced.`))return;
    const inc=Object.assign(blank(),d); inc.updatedAt=Date.now();
    inc.sessions.forEach(s=>{if(!s.id)s.id=uid(); if(!s.mtime)s.mtime=1});
    DB=mergeDocs(DB,inc); save(); render(); alert('Imported.');
  }catch(e){alert('Import failed: '+e.message)} };
  r.readAsText(f); inp.value='';
}
function wipe(){
  if(!confirm('Erase all sessions and player info?'))return;
  if(!confirm('Really erase? Export a backup first if you want to keep it.'))return;
  const ts=Date.now(), tombs=DB.sessions.map(s=>({id:s.id,ts}));   // so the erase syncs to your other devices too
  DB=blank(); DB.deleted=tombs; save(); render();
}

/* ============================== boot ============================== */
(function(){const el=document.getElementById('hubLink');
  if(el&&location.pathname.replace(/\/+$/,'')!=='')el.hidden=false;})();
readSession();
// a device that already knows its borrowed sign-in died should still say so, not just "local"
if(!session)try{EXPIRED=!!localStorage.getItem(DEADTOK)}catch(e){}
DB=load();
// open on whichever discipline was logged most recently
(function(){const last=DB.sessions.slice().sort((a,b)=>a.date<b.date?-1:1).pop();
  if(last)VIEWKIND=kindOf(last); TRENDK=TRENDDEF[VIEWKIND]; LOGKIND=VIEWKIND;})();
// parser moved on since this data was written? re-read the stored files
if((DB.parserV||0)!==PARSER_V){
  const n=backfillAll(); DB.parserV=PARSER_V;
  if(n){DB.updatedAt=Date.now(); BACKFILLED=n}
  saveLocal();
}
render();
(function(){const inc=readImportLink(); if(inc)setTimeout(()=>offerImport(inc),60)})();
setSync(session?'saving':'local');
startSync();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&session)pullMerge()});
</script>
</body>
</html>
