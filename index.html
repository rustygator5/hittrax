    {k:'outPct',  label:'Projected outs',   type:'prop',u:'%',  d:0,dir:'up',  set:x=>!!x.outcome,f:x=>x.outcome==='out'},
    {k:'exchSD',  label:'Exchange spread',  type:'sd',  u:'s',  d:2,dir:'down',f:x=>num(x.exch)>0.2?num(x.exch):null},
  ];
  const ps=rows.map(x=>num(x.pitch)).filter(v=>v>0).sort((a,b)=>a-b);
  const pRef=ps.length?ps[Math.floor(ps.length/2)]:null;
  const type=x=>x.btype||bucket(x.la), la=x=>num(x.la);
  const list=[
    {k:'avgEV', label:'Avg exit velo',  type:'mean',u:'mph',d:1,dir:'up',f:x=>num(x.ev)},
    {k:'hha',   label:'Hard-hit rate',  type:'prop',u:'%',  d:0,dir:'up',set:()=>true,f:x=>+x.ev>=x._hh},
    {k:'sweet', label:'Sweet-spot rate',type:'prop',u:'%',  d:0,dir:'up',set:x=>la(x)!=null,f:x=>la(x)>=8&&la(x)<=32},
    {k:'ld',    label:'Line-drive rate',type:'prop',u:'%',  d:0,dir:'up',set:x=>!!type(x),f:x=>type(x)==='ld'},
    {k:'gb',    label:'Ground-ball rate',type:'prop',u:'%', d:0,dir:'down',set:x=>!!type(x),f:x=>type(x)==='gb'},
    {k:'avgLA', label:'Avg launch angle',type:'mean',u:'°', d:1,dir:'win',f:la},
    {k:'laSD',  label:'Launch angle spread',type:'sd',u:'°', d:1,dir:'down',f:la},
  ];
  if(pRef!=null){
    list.splice(1,0,{k:'adjEV',label:`Exit velo at a ${Math.round(pRef)} mph pitch`,type:'mean',u:'mph',d:1,dir:'up',
      f:x=>num(x.pitch)>0?+x.ev-x._bq*(+x.pitch-pRef):null});
    list.splice(2,0,{k:'batSpeed',label:'Bat speed (est., top quarter)',type:'top',u:'mph',d:1,dir:'up',
      f:x=>num(x.pitch)>0?(+x.ev-x._bq*(+x.pitch))/(1+x._bq):null});
  }
  return list;
}
function rollRows(kind){return pooledRows(kind)}
function wilson(x,n){                       // honest interval for a rate on a small sample
  if(!n)return null; const z=Z95, p=x/n, den=1+z*z/n;
  const c=(p+z*z/(2*n))/den, h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/den;
  return {v:p*100,lo:(c-h)*100,hi:(c+h)*100,n};
}
function windowStat(m,win){
  if(m.type==='prop'){const s=win.filter(m.set); return wilson(s.filter(m.f).length,s.length)}
  const vals=win.map(m.f).filter(v=>v!=null);
  if(m.type==='sd'){const s=sdOf(vals,4); return s==null?null:{v:s,n:vals.length}}
  if(m.type==='top'){
    if(vals.length<4)return null;
    const top=vals.sort((a,b)=>b-a).slice(0,Math.max(1,Math.round(vals.length*0.25)));
    return {v:top.reduce((a,c)=>a+c,0)/top.length,n:vals.length};     // no clean band for a top-quarter mean
  }
  const mv=meanVar(vals); if(!mv)return null;
  const h=Z95*Math.sqrt(mv.v/mv.n); return {v:mv.m,lo:mv.m-h,hi:mv.m+h,n:mv.n};
}
function rollingSeries(kind,m,N,rows){
  const pts=[];
  for(let i=N;i<=rows.length;i++){const st=windowStat(m,rows.slice(i-N,i)); if(st)pts.push({i,...st,d:rows[i-1]._d})}
  return pts;
}
// start vs now, on windows that don't share a single ball
function rollVerdict(m,N,rows){
  if(rows.length<2*N)return {need:true};
  const a=rows.slice(0,N), b=rows.slice(rows.length-N);
  let r=null;
  const vals=g=>m.type==='prop'?g.filter(m.set).map(x=>m.f(x)?1:0):g.map(m.f).filter(v=>v!=null);
  if(m.type==='prop'||m.type==='mean'){
    const A=groupByVisit(a).map(vals), B=groupByVisit(b).map(vals);
    if(A.flat().length>=5&&B.flat().length>=5)r=testClustered(A,B,m.type==='prop'?100:1)}
  return {r,start:windowStat(m,a),now:windowStat(m,b)};
}
function rollingChart(pts,m,rows,N){
  const W=720,H=300,P={l:46,r:16,t:18,b:42};
  const tot=rows.length;
  const X=i=>P.l+(W-P.l-P.r)*((i-1)/Math.max(1,tot-1));
  const base=pts[0];
  const ys=pts.flatMap(p=>[p.v,p.lo,p.hi]).concat(base?[base.lo,base.hi]:[]).filter(v=>v!=null&&isFinite(v));
  let lo=Math.min(...ys), hi=Math.max(...ys); if(hi-lo<1e-6){hi+=1;lo-=1}
  const pad=(hi-lo)*0.1; lo-=pad; hi+=pad;
  if(m.u==='%'){lo=Math.max(0,lo);hi=Math.min(100,hi)}
  const Y=v=>P.t+(H-P.t-P.b)*(1-(v-lo)/(hi-lo));
  let g='';
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4, y=Y(v);
    g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#27395c"/>
      <text x="${P.l-6}" y="${(y+4).toFixed(1)}" fill="#6c7fa5" font-size="10" text-anchor="end">${v.toFixed(m.u==='s'?2:(m.u==='%'?0:1))}</text>`}
  // session boundaries, labelled sparingly
  let lastX=-99, firstIdx={};
  rows.forEach((r,i)=>{if(!(r._d in firstIdx))firstIdx[r._d]=i+1});
  Object.keys(firstIdx).forEach(d=>{const x=X(firstIdx[d]);
    g+=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${P.t}" y2="${H-P.b}" stroke="rgba(147,164,198,.18)" stroke-dasharray="2 4"/>`;
    if(x-lastX>52){g+=`<text x="${(x+3).toFixed(1)}" y="${H-P.b+14}" fill="#6c7fa5" font-size="9.5">${esc(d.slice(5))}</text>`; lastX=x}});
  // where he started: the first full window and its band
  if(base&&base.lo!=null)g+=`<rect x="${P.l}" y="${Y(base.hi).toFixed(1)}" width="${W-P.l-P.r}" height="${Math.max(1,Y(base.lo)-Y(base.hi)).toFixed(1)}"
      fill="rgba(147,164,198,.10)"/><line x1="${P.l}" x2="${W-P.r}" y1="${Y(base.v).toFixed(1)}" y2="${Y(base.v).toFixed(1)}"
      stroke="rgba(147,164,198,.55)" stroke-dasharray="5 4"/><text x="${W-P.r-4}" y="${(Y(base.v)-5).toFixed(1)}" fill="#93a4c6" font-size="9.5" text-anchor="end">where he started</text>`;
  // the band, then the line
  const band=pts.filter(p=>p.lo!=null);
  if(band.length>1)g+=`<path d="M${band.map(p=>X(p.i).toFixed(1)+' '+Y(p.hi).toFixed(1)).join(' L')} L${band.slice().reverse().map(p=>X(p.i).toFixed(1)+' '+Y(p.lo).toFixed(1)).join(' L')} Z"
      fill="rgba(250,70,22,.16)"/>`;
  if(pts.length>1)g+=`<path d="M${pts.map(p=>X(p.i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' L')}" fill="none" stroke="#FA4616" stroke-width="2.5" stroke-linejoin="round"/>`;
  const end=pts[pts.length-1];
  if(end)g+=`<circle cx="${X(end.i).toFixed(1)}" cy="${Y(end.v).toFixed(1)}" r="4.5" fill="#FA4616" stroke="#0b1220" stroke-width="1.5"><title>Now: ${end.v.toFixed(m.d)}${m.u==='%'?'%':' '+m.u}</title></circle>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${g}
    <text x="${P.l}" y="${H-6}" fill="#6c7fa5" font-size="10">${KIND[VIEWKIND].label==='Catching'?'throw':'ball'} number → (each point = the last ${N})</text></svg>
   <div class="legend"><span><i style="background:#FA4616"></i>last ${N}</span>
     ${band.length?'<span><i style="background:rgba(250,70,22,.35)"></i>95% band</span>':''}
     ${base&&base.lo!=null?'<span><i style="background:rgba(147,164,198,.4)"></i>where he started</span>':''}</div>`;
}
function rollingView(){
  const kind=VIEWKIND;
  if(kind==='games')return `<div class="card"><h2>Rolling progress</h2><div class="hint">Games come in as box-score lines, so
    there's no plate-appearance order to roll through — the season line on the session view is the equivalent.</div></div>`;
  const rows=rollRows(kind), ms=rollMetrics(kind,rows);
  let m=ms.find(x=>x.k===ROLLK[kind])||ms[0]; ROLLK[kind]=m.k;
  const opts=ROLLW[kind];
  let N=ROLLN[kind];
  if(!opts.includes(N)){const fit=opts.filter(n=>rows.length>=2*n); N=fit.length?fit[fit.length-1]:opts[0]}
  const unit=kind==='catching'?'clean throws':'batted balls';
  const head=`<div class="row" style="align-items:center;gap:10px;margin:10px 0">
      <select onchange="ROLLK.${kind}=this.value;render()" style="max-width:280px">
        ${ms.map(x=>`<option value="${x.k}" ${x.k===m.k?'selected':''}>${esc(x.label)}</option>`).join('')}</select>
      <div class="seg">${opts.map(n=>`<button class="${n===N?'on':''}" onclick="ROLLN.${kind}=${n};render()">last ${n}</button>`).join('')}</div>
    </div>`;
  if(rows.length<N)return `<div class="card"><h2>Rolling progress</h2>${head}
    <div class="hint">Needs at least ${N} ${unit} to draw the first window — you have ${rows.length}.
    Pick a shorter window, or log another session.</div></div>`;
  const pts=rollingSeries(kind,m,N,rows), V=rollVerdict(m,N,rows);
  const f=v=>v==null?'—':(m.u==='%'?Math.round(v)+'%':v.toFixed(m.d)+' '+m.u);
  const band=s=>s&&s.lo!=null?` <small style="color:var(--dim)">(${f(s.lo).replace(/ (mph|s|°)$/,'')}–${f(s.hi)})</small>`:'';
  let verdict;
  if(V.need)verdict=`<div class="hint">Comparing where he started with now needs two windows that don't share a ball —
    ${2*N} ${unit}; you have ${rows.length}. The line still shows the shape.</div>`;
  else if(V.r&&V.r.few)verdict=`<div class="hint">The first and last ${N} each need balls from at least two visits before the
    change can be judged — one visit can't separate a good day from a better swing.</div>`;
  else if(!V.r)verdict=`<div class="hint">${m.type==='sd'?'Spreads':'Top-quarter averages'} don't have a clean confidence band here — read the line's direction rather than a verdict.</div>`;
  else{
    const good=moveGood({dir:m.dir,diff:V.r.diff,from:V.r.from,to:V.r.to});
    verdict=`<div class="note${V.r.sig?'':' warn'}" style="margin-top:10px">${V.r.sig
      ?`<b>${good?'Real improvement':'Real slide'}:</b> ${esc(m.label.toLowerCase())} went from ${f(V.r.from)} to ${f(V.r.to)} — a change of ${Math.abs(V.r.diff).toFixed(m.d)}${m.u==='%'?' pts':' '+m.u}, beyond the ±${V.r.need.toFixed(m.d)} that noise could explain.`
      :`<b>Not yet distinguishable:</b> ${esc(m.label.toLowerCase())} moved from ${f(V.r.from)} to ${f(V.r.to)}, but noise alone could explain up to ±${V.r.need.toFixed(m.d)}${m.u==='%'?' pts':' '+m.u}. Keep logging.`}</div>`;
  }
  return `<div class="card"><h2>Rolling progress</h2>
    <div class="hint">Every ${unit.replace(/s$/,'')} in order, sessions ignored — each point is the last ${N}, with its 95% band.
      The verdict below compares visits, not balls, so one hot day can't make the call.</div>
    ${head}${rollingChart(pts,m,rows,N)}
    <div class="tiles" style="margin-top:14px">
      <div class="tile"><div class="k">Where he started</div><div class="v" style="font-size:22px">${f(V.start?V.start.v:pts[0].v)}</div><div class="d flat">first ${N}${band(V.start||pts[0])}</div></div>
      <div class="tile"><div class="k">Now</div><div class="v" style="font-size:22px">${f((V.now||pts[pts.length-1]).v)}</div><div class="d flat">last ${N}${band(V.now||pts[pts.length-1])}</div></div>
      <div class="tile"><div class="k">${unit.replace(/^./,c=>c.toUpperCase())} logged</div><div class="v" style="font-size:22px">${rows.length}</div></div>
    </div>${verdict}</div>`;
}

/* ============================== goals ==============================
   A target, where he was when it was set, and where he is now — "now" read off a recent
   window of balls or throws (or the season line for games), never one lucky session. */
const GOALDEF={
  hitting:[['avgEV','Avg exit velo','mph',1,'up'],['batSpeed','Bat speed (est.)','mph',1,'up'],['hha','Hard-hit rate','%',0,'up'],
           ['sweet','Sweet-spot rate','%',0,'up'],['ld','Line-drive rate','%',0,'up'],['gb','Ground-ball rate','%',0,'down'],
           ['laSD','Launch angle spread','°',1,'down']],
  catching:[['avgPop','Avg pop time','s',2,'down'],['avgExch','Avg exchange','s',2,'down'],['exchSD','Exchange spread','s',2,'down'],
            ['avgVelo','Avg arm strength','mph',1,'up'],['outPct','Projected outs','%',0,'up']],
  games:[['avg','Batting average','',3,'up'],['obp','On-base','',3,'up'],['ops','OPS','',3,'up'],['kPct','Strikeout rate','%',0,'down'],
         ['bbPct','Walk rate','%',0,'up'],['qabPct','Quality AB %','%',0,'up']],
};
const goalMeta=(kind,k)=>{const d=(GOALDEF[kind]||[]).find(x=>x[0]===k); return d?{k:d[0],label:d[1],u:d[2],d:d[3],dir:d[4]}:null};
// where he is now on a goal metric
function goalCurrent(kind,k){
  if(kind==='games'){const G=sorted('games').map(s=>sessionStats(s)); if(!G.length)return null;
    const t=sumGames(G); const v=num(t[k]); return v==null?null:{v,basis:`season, ${t.pa||0} PA`}}
  const rows=rollRows(kind); if(!rows.length)return null;
  const N=Math.min(kind==='catching'?15:30,rows.length);
  const win=rows.slice(rows.length-N);
  if(k==='laSD'){const v=sdOf(win.map(x=>num(x.la)).filter(v=>v!=null),4); return v==null?null:{v,basis:`last ${N} balls`}}
  if(k==='exchSD'){const v=sdOf(win.map(x=>num(x.exch)).filter(v=>v>0.2),4); return v==null?null:{v,basis:`last ${N} throws`}}
  const m=rollMetrics(kind,rows).find(x=>x.k===k); if(!m)return null;
  const st=windowStat(m,win); return st?{v:st.v,basis:`last ${N} ${kind==='catching'?'throws':'balls'}`}:null;
}
const goalFmt=(m,v)=>v==null?'—':(m.u===''?avg3(v):(m.u==='%'?Math.round(v)+'%':v.toFixed(m.d)+' '+m.u));
function goalsCard(kind){
  const list=(DB.goals||[]).filter(g=>g.kind===kind);
  const defs=GOALDEF[kind]||[];
  const rows=list.map(g=>{
    const m=goalMeta(kind,g.metric); if(!m)return'';
    const cur=goalCurrent(kind,g.metric);
    const span=g.target-g.start;
    let prog=0, hit=false;
    if(cur&&span!==0){prog=Math.max(0,Math.min(1,(cur.v-g.start)/span)); hit=(m.dir==='down')?cur.v<=g.target:cur.v>=g.target}
    const due=g.by?` · by ${esc(g.by)}`:'';
    return `<div style="padding:10px 0;border-bottom:1px solid rgba(39,57,92,.55)">
      <div class="row" style="align-items:baseline;gap:8px">
        <b>${esc(m.label)}</b><span class="hint">${m.dir==='down'?'down to':'up to'} ${goalFmt(m,g.target)}${due}</span>
        ${hit?'<span class="chip g">reached</span>':''}
        <button class="btn ghost" style="margin-left:auto;padding:3px 9px;font-size:12px" onclick="delGoal('${esc(g.id)}')">Remove</button></div>
      <div class="bar" style="margin-top:7px"><i style="width:${Math.round(prog*100)}%;${hit?'background:linear-gradient(90deg,#2fbf71,#7fe0ab)':''}"></i></div>
      <div class="hint" style="margin-top:4px">started at ${goalFmt(m,g.start)} · now ${cur?goalFmt(m,cur.v)+` <small>(${esc(cur.basis)})</small>`:'—'} · ${Math.round(prog*100)}% of the way</div>
    </div>`}).join('');
  return `<div class="card"><h2>Goals</h2>
    <div class="hint">Something to chase. "Now" is read off his recent ${kind==='games'?'season line':(kind==='catching'?'throws':'balls')}, not one good day.</div>
    ${rows||'<div class="hint" style="margin-top:8px">No goals yet for this side of his game.</div>'}
    <div class="row" style="margin-top:12px;gap:8px;align-items:flex-end">
      <div style="flex:2 1 170px"><label>Measure</label><select id="g_metric">${defs.map(d=>`<option value="${d[0]}">${esc(d[1])}</option>`).join('')}</select></div>
      <div style="flex:1 1 90px"><label>Target</label><input id="g_target" type="number" step="any" placeholder="${kind==='games'?'.300':''}"></div>
      <div style="flex:1 1 130px"><label>By (optional)</label><input id="g_by" type="date"></div>
      <button class="btn sec" onclick="addGoal('${kind}')">Add goal</button></div>
  </div>`;
}
function addGoal(kind){
  const k=document.getElementById('g_metric').value, m=goalMeta(kind,k);
  let target=num(document.getElementById('g_target').value), by=document.getElementById('g_by').value||null;
  if(!m||target==null){alert('Pick a measure and type a target.');return}
  if(m.u===''&&target>1)target=target/1000;             // ".300" or "300" both mean .300
  const cur=goalCurrent(kind,k);
  if(!cur){alert('There is no data for that measure yet — log a session first so the goal has a starting point.');return}
  const already=(m.dir==='down')?cur.v<=target:cur.v>=target;
  if(already&&!confirm(`He's already at ${goalFmt(m,cur.v)} — set the goal anyway?`))return;
  DB.goals=DB.goals||[];
  DB.goals.push({id:uid(),kind,metric:k,target,start:cur.v,created:localDate(),by:SAFE_DATE.test(by||'')?by:null,mtime:Date.now()});
  save(); render();
}
function delGoal(id){
  if(!confirm('Remove this goal?'))return;
  DB.goals=(DB.goals||[]).filter(g=>g.id!==id);
  DB.deleted.push({id,ts:Date.now()});
  save(); render();
}

/* ============================== coach's summary ==============================
   One strength, one thing to work on, one drill — pulled from all three sides of his game and
   only from evidence the app trusts (changes that cleared the noise, recent windows, benchmarks). */
// thresholds: 1 K in 9 PA could be a true rate anywhere from 2% to 43%, so game reads wait for ~25 PA
const GAME_PA=25, GAME_BIP=15, SWEET_LOW=35, GB_HIGH=50;
function coachSummaryCard(){
  const S=[], F=[], basis=[];
  const push=(arr,w,src,text,drill)=>arr.push({w,src,text,drill});
  // --- hitting ---
  const hitRows=rollRows('hitting');
  if(hitRows.length){
    basis.push(`${hitRows.length} batted balls`);
    const mv=movingTests('hitting');
    (mv.tests||[]).filter(r=>r.confirmed&&moveGood(r)).forEach(r=>push(S,3,'Hitting',`${r.label} up ${Math.abs(r.diff).toFixed(r.pct?0:1)}${r.pct?' pts':' mph'} — beyond the noise.`));
    (mv.tests||[]).filter(r=>r.confirmed&&!moveGood(r)).forEach(r=>push(F,2.5,'Hitting',`${r.label} slipping (${r.pct?Math.round(r.from)+'% → '+Math.round(r.to)+'%':r.from.toFixed(1)+' → '+r.to.toFixed(1)}).`,'Back to the basics that produced the earlier numbers — short, focused tee rounds before live work.'));
    const recent=hitRows.slice(-30), st=computeFromBalls(recent,recent[recent.length-1]._hh)||{};
    if(recent.length>=15){
      // big-league hitters put about a third of their balls in 8–32° and ~43% on the ground — so the
      // flags sit past those marks, not at them (a soft cage feed should if anything beat them)
      if(num(st.sweet)!=null&&st.sweet<SWEET_LOW)push(F,2,'Hitting',`Only ${Math.round(st.sweet)}% of recent balls are in the 8–32° window — big leaguers manage about a third.`,'Line-drive-only rounds off the tee: score a point only for balls that would clear the infield on a line.');
      if(num(st.gb)>=GB_HIGH)push(F,2,'Hitting',`${Math.round(st.gb)}% ground balls lately — the barrel is working down.`,'High-tee, top-half-of-the-zone work: drive it, don’t lift it.');
    }
    // feed-speed bat drop on the latest hitting date
    const last=sorted('hitting').slice(-1)[0];
    if(last){
      const R=roundsOfDate(last).filter(r=>dispo(r)!=='out').map(r=>({p:num(r.pitch),b:num(sessionStats(r).batSpeed)})).filter(x=>x.p!=null&&x.b!=null);
      if(R.length>=2){const fast=R.reduce((a,c)=>c.p>a.p?c:a), slow=R.reduce((a,c)=>c.p<a.p?c:a);
        if(fast.p-slow.p>=5&&fast.b-slow.b>=3)push(F,3,'Hitting',`Swings about ${(fast.b-slow.b).toFixed(1)} mph slower on the ${Math.round(slow.p)} mph feed than the ${Math.round(fast.p)} mph one.`,'Alternate slow front toss with machine rounds. On the slow ones, same intent and same speed — count a slowed-down swing as a miss.')}
      const bat=num(sessionStats(last).batSpeed), bb=batBench(DB.player.age);
      if(bat!=null&&bb&&bat>=bb.lo)push(S,1.5,'Hitting',`Bat speed about ${bat.toFixed(0)} mph — inside the ${bb.label} range.`);
    }
  }
  // --- catching ---
  const thrRows=rollRows('catching');
  if(thrRows.length){
    basis.push(`${thrRows.length} clean throws`);
    const mv=movingTests('catching');
    (mv.tests||[]).filter(r=>r.confirmed&&moveGood(r)).forEach(r=>push(S,3,'Catching',`${r.label} improved (${r.from.toFixed(2)} → ${r.to.toFixed(2)}) — beyond the noise.`));
    const st=computeFromThrows(thrRows.slice(-20))||{}, pb=popBench(DB.player.age);
    const allPop=computeFromThrows(vs2B(sorted('catching')).flatMap(s=>s.throws||[]))||{};
    if(pb&&num(allPop.bestPop)!=null&&allPop.bestPop<=pb.elite)push(S,2,'Catching',`Best pop ${allPop.bestPop.toFixed(2)}s — elite range for age ${pb.label}.`);
    if(num(st.avgExch)!=null&&st.avgExch<0.8)push(S,2,'Catching',`Quick exchange: ${st.avgExch.toFixed(2)}s average.`);
    if(num(st.avgExch)>=0.95)push(F,2.5,'Catching',`Exchange is the slow part (${st.avgExch.toFixed(2)}s).`,'Exchange-only reps: receive to release, no throw, timed. Ten clean ones before any throw-downs.');
    if(num(st.avgExch)!=null&&st.avgExch<0.8&&pb&&num(st.avgPop)>pb.good)push(F,2,'Catching',`Pop time is all ball flight now — the exchange is already quick.`,'Arm strength is the lever: a long-toss progression twice a week, as his arm allows.');
    if(num(allPop.cleanPct)!=null&&allPop.cleanPct<80)push(F,2,'Catching',`${Math.round(allPop.cleanPct)}% of throw-down reps are clean.`,'Slow it down: ten throw-downs focused only on a clean transfer before adding speed.');
  }
  // arm care outranks everything
  const wl=(()=>{const html=workloadCard(); return /Spike:/.test(html)})();
  if(wl)push(F,5,'Catching','Throwing load jumped this week.','Cut the next session’s throws roughly in half and build back up over a week.');
  // --- games ---
  const G=sorted('games').map(s=>sessionStats(s));
  if(G.length){
    const g=sumGames(G); basis.push(`${g.pa||0} game PA`);
    if((g.pa||0)>=GAME_PA&&g.kPct!=null&&g.kPct<=15)push(S,2,'Games',`Puts the ball in play — ${Math.round(g.kPct)}% strikeouts.`);
    if((g.pa||0)>=GAME_PA&&g.bbPct!=null&&g.bbPct>=15)push(S,1.5,'Games',`Patient — walks in ${Math.round(g.bbPct)}% of plate appearances.`);
    // passed balls: the receiving/blocking side HitTrax never sees. Some are on the pitcher (and
    // 12U pitchers are wild), but past ~1.5 a game the catcher's blocks are part of it.
    if((g.outs||0)>=36&&g.pb6!=null&&g.pb6>=1.5)push(F,2.5,'Catching',`${g.pb} passed balls in ${innStr(g.outs)} innings caught — about ${g.pb6.toFixed(1)} per 6-inning game.`,
      'Blocking, 10 minutes a session: knees down on short-hop flips in the dirt — chest over the ball, glove closing the gap between the knees, ball kept in front. Start slow and straight on, then add angles.');
    if((g.pa||0)>=GAME_PA&&g.kPct!=null&&g.kPct>=30)push(F,2.5,'Games',`Striking out in ${Math.round(g.kPct)}% of plate appearances.`,'Two-strike approach: choke up, widen the stance, protect the plate.');
    if(hitRows.length){
      const c=computeFromBalls(hitRows,HH())||{}, bip=Math.max(0,(g.ab||0)-(g.k||0)-(g.hr||0)+(g.sf||0));
      if(bip>=GAME_BIP&&g.fbPct!=null&&c.fb!=null&&g.fbPct-c.fb>=20)push(F,3,'Games',`Gets under it in games: ${Math.round(g.fbPct)}% fly balls vs ${Math.round(c.fb)}% in the cage.`,'Game-speed machine rounds scored line-drive only — the soft feed in the cage isn’t testing the swing he needs.');
    }
  }
  if(!S.length&&!F.length)return'';
  S.sort((a,b)=>b.w-a.w); F.sort((a,b)=>b.w-a.w);
  const s=S[0], f=F[0];
  const tile=(label,cls,x)=>x?`<div class="tile" style="flex:1 1 240px"><div class="k">${label} <span class="chip ${cls}" style="font-size:9px">${esc(x.src)}</span></div>
    <div style="font-size:15px;font-weight:700;margin-top:6px;line-height:1.35">${x.text}</div></div>`:'';
  return `<div class="card" style="border-color:rgba(250,70,22,.45)"><h2>Coach's read</h2>
    <div class="hint">One thing going well, one thing to work on — only from evidence that holds up (${esc(basis.join(' · '))})</div>
    <div class="row" style="margin-top:10px;gap:10px">${tile('Going well','g',s)}${tile('Work on','a',f)}</div>
    ${f&&f.drill?`<div class="note" style="margin-top:10px"><b>Drill:</b> ${f.drill}</div>`:''}
  </div>`;
}

function pbCard(){

// Same date, same number of rows, same first and last ball: that's the same export again.
function roundSig(kind,date,rows){
  const f=rows[0]||{}, l=rows[rows.length-1]||{};
  const n=v=>v==null?'-':(+v).toFixed(2);
  return [kind,date,rows.length,n(f.ev||f.pop),n(f.la||f.velo),n(l.ev||l.pop),n(l.la||l.velo)].join('|');
}
function findSameRound(kind,date,rows){
  return DB.sessions.find(s=>kindOf(s)===kind&&s.date===date&&
    roundSig(kind,s.date,(kind==='catching'?s.throws:s.balls)||[])===roundSig(kind,date,rows));
}
/* ---------- stored source files + backfill ---------- */
const MAXFILE=1200000;                       // ~1.2 MB of CSV is already a huge session
function storeFile(name,text){
  if(!text||text.length>MAXFILE)return null;
  const id=uid();
  DB.files=DB.files||{};
  DB.files[id]={name:name||'pasted rows',text,ts:Date.now()};
  return id;
}
function fileBytes(){return Object.values(DB.files||{}).reduce((a,f)=>a+(f.text||'').length,0)}
function pruneFiles(){                       // drop files no session points at any more
  const used=new Set(DB.sessions.map(s=>s.src&&s.src.f).filter(Boolean));
  Object.keys(DB.files||{}).forEach(id=>{if(!used.has(id))delete DB.files[id]});
}
// Re-read a round from the file it came from, so new columns appear without a re-upload.
function backfillSession(s){
  const f=s.src&&DB.files&&DB.files[s.src.f]; if(!f)return false;
  const cat=kindOf(s)==='catching';
  const r=cat?parseThrows(f.text):parsePaste(f.text);
  let rows=cat?r.throws:r.balls;
  if(!rows.length)return false;
  if(r.dates.length>1&&s.src.date)rows=rows.filter(x=>x.date===s.src.date);
  const had=((cat?s.throws:s.balls)||[]).length;
  if(!rows.length||(had&&Math.abs(rows.length-had)>Math.max(2,had*0.1)))return false;  // not the same round
  const before=JSON.stringify(cat?s.throws:s.balls);
  if(cat){s.throws=rows; s.summary=computeFromThrows(rows)}
  else{s.balls=rows; s.summary=computeFromBalls(rows,s.hh||HH(),s.bq||Q(),s.pitch)}
  const ap=avgPitch(rows); if(ap!=null)s.pitch=ap;
  const changed=JSON.stringify(cat?s.throws:s.balls)!==before;
  if(changed)s.mtime=Date.now();
  return changed;
}
function backfillAll(){
  let n=0; DB.sessions.forEach(s=>{if(backfillSession(s))n++});
  return n;
}
function saveSession(){
  const g=id=>document.getElementById(id);
  const cat=LOGKIND==='catching';
  const pitchEl=g('f_pitch');
  const s={id:uid(),kind:LOGKIND,date:g('f_date').value,type:g('f_type').value,pitch:pitchEl?num(pitchEl.value):null,
    location:g('f_loc').value.trim(),notes:g('f_notes').value.trim(),mode:LOGMODE};
  if(LOGKIND==='hitting'){s.hh=HH(); s.bq=Q();}   // frozen: a birthday or a new bat must not re-score this session
  if(!s.date){alert('Pick a date.');return}
  const pack=(rows)=>Object.assign(cat?{throws:rows,summary:computeFromThrows(rows)}
                        :{balls:rows,summary:computeFromBalls(rows,HH())},{pitch:avgPitch(rows)});
  if(LOGMODE==='detail'&&LOGKIND!=='games'){
    if(!PARSED.length)doParse();
    if(!PARSED.length){alert('Nothing parsed yet — upload a CSV or paste rows, then hit Parse.');return}
    const splitBox=document.getElementById('f_split');
    if(splitBox&&splitBox.checked){        // one session per date in the file
      const groups=groupByDate(), now=Date.now(); let fresh=0,again=0;
      const fid=storeFile(RAWNAME,RAW!=null?RAW:(g('f_paste')||{}).value);
      groups.forEach((gr,i)=>{
        const date=gr.date==='(no date)'?s.date:gr.date, d=pack(gr.balls);
        const pitch=s.pitch!=null?s.pitch:(d.pitch!=null?d.pitch:null);
        const src=fid?{f:fid,date:groups.length>1?date:null}:null;
        const dupe=findSameRound(LOGKIND,date,gr.balls);
        if(dupe){Object.assign(dupe,d,{pitch,mtime:now+i},src?{src}:{});again++}
        else{DB.sessions.push({...s,...d,id:uid(),mtime:now+i,pitch,date,src});fresh++}});
      pruneFiles();
      save(); clearParse(); VIEWKIND=LOGKIND;
      alert(savedMsg(fresh,again)); go('sessions'); return;
    }
    Object.assign(s,pack(PARSED));   // pitch speed comes from the file
  }else if(LOGKIND==='games'){
    const sum={}; let any=false;
    GCOUNT.forEach(([k])=>{const e=document.getElementById('s_'+k); if(!e)return;
      const v=num(e.value); if(v!=null){sum[k]=v;any=true}});
    if(!any){alert('Enter at least one number from the box score.');return}
    if(num(sum.gp)>1&&!['Season to date','Doubleheader','Tournament'].includes(s.type)&&
       confirm(`GP is ${sum.gp}. Is this GameChanger's season-to-date line?\n\nOK = season to date (it replaces earlier season lines, nothing is counted twice)\nCancel = ${sum.gp} games played on this date`))
      s.type='Season to date';
    s.summary=sum; s.mode='game';
  }else{
    const sum={}; let any=false;
    KIND[LOGKIND].metrics.forEach(m=>{const e=document.getElementById('s_'+m.k); if(!e)return;
      const v=num(e.value); if(v!=null){sum[m.k]=v;any=true}});
    if(!any){alert('Enter at least one number.');return}
    ['hha','onTarget','outPct'].forEach(k=>{if(sum[k]!=null&&sum[k]<=1)sum[k]*=100});   // accept .450 or 45
    s.summary=sum;
  }
  s.mtime=Date.now();
  // the same export again? refresh that round in place rather than logging it twice
  const rows=LOGMODE==='detail'?PARSED:null;
  if(rows){const fid=storeFile(RAWNAME,RAW!=null?RAW:(g('f_paste')||{}).value); if(fid)s.src={f:fid,date:null}}
  const dupe=rows?findSameRound(LOGKIND,s.date,rows):null;
  if(dupe){Object.assign(dupe,pack(rows),{mtime:Date.now()},s.src?{src:s.src}:{});
    if(s.notes)dupe.notes=s.notes;
    pruneFiles();
    save(); clearParse(); VIEWKIND=LOGKIND;
    alert('That round was already logged — refreshed it in place (outcomes and all) instead of adding a duplicate.');
    go('dash'); return;}
  DB.sessions.push(s); pruneFiles(); save(); clearParse(); VIEWKIND=LOGKIND; go('dash');
}
function savedMsg(fresh,again){
  const bits=[];
  if(fresh)bits.push(`Saved ${fresh} session${fresh>1?'s':''}`);
  if(again)bits.push(`refreshed ${again} already logged`);
  return bits.join(' · ')+'.';
}

/* ---------- trends ---------- */
function trendModeBar(){
  return `<div class="seg" style="margin-bottom:4px">
    <button class="${TRENDMODE==='session'?'on':''}" onclick="TRENDMODE='session';render()">By session</button>
    <button class="${TRENDMODE==='rolling'?'on':''}" onclick="TRENDMODE='rolling';render()">Rolling by ${VIEWKIND==='catching'?'throw':'ball'}</button></div>`;
}
function vTrends(){
  if(TRENDMODE==='rolling')return `<div style="margin-top:14px">${trendModeBar()}</div>`+rollingView();
  const avail=KIND[VIEWKIND].metrics.filter(m=>series(m.k).length>0);
  if(!avail.length)return '<div class="card"><div class="empty">Log a session first.</div></div>';
  if(!avail.find(m=>m.k===TRENDK))TRENDK=avail[0].k;
  const S=series(TRENDK);
  const b=bench(DB.player.age), pb=popBench(DB.player.age);
  let band=MK[TRENDK].dir==='win'?MK[TRENDK].win:null;
  if(TRENDK==='maxEV'&&b)band=[b.good[0],b.good[1]];
  if((TRENDK==='avgPop'||TRENDK==='bestPop')&&pb)band=[pb.elite,pb.good];
  const first=S[0],lastp=S[S.length-1];
  const chg=S.length>1?lastp.v-first.v:null;
  // hitting and catching: the first visits against the latest, pooled and tested — not two single days
  const PR=VIEWKIND==='games'?null:progressRows(VIEWKIND);
  const pr=PR&&PR.rows.find(r=>r.m.k===TRENDK);
  const unit=k=>MK[k].u==='%'?'%':(MK[k].u?' '+MK[k].u:'');
  const tiles=pr?`
     <div class="tile"><div class="k">Start</div><div class="v">${fmt(TRENDK,pr.f)}<small>${MK[TRENDK].u}</small></div><div class="d flat">${esc(spanOf(PR.W.S))}</div></div>
     <div class="tile"><div class="k">Now</div><div class="v">${fmt(TRENDK,pr.l)}<small>${MK[TRENDK].u}</small></div><div class="d flat">${esc(spanOf(PR.W.R))}</div></div>
     <div class="tile"><div class="k">Change</div><div class="v ${pr.tested?pr.cls:dirClass(TRENDK,pr.d)}">${pr.d==null?'—':dstr(TRENDK,pr.d)}</div><div class="d flat">${esc(pr.read)}</div></div>
     <div class="tile"><div class="k">Sessions</div><div class="v">${S.length}</div></div>`
   :`
     <div class="tile"><div class="k">First (${esc(first.date)})</div><div class="v">${fmt(TRENDK,first.v)}<small>${MK[TRENDK].u}</small></div></div>
     <div class="tile"><div class="k">Latest (${esc(lastp.date)})</div><div class="v">${fmt(TRENDK,lastp.v)}<small>${MK[TRENDK].u}</small></div></div>
     <div class="tile"><div class="k">${VIEWKIND==='games'?'Change':'Total change'}</div><div class="v ${dirClass(TRENDK,chg)}">${chg==null?'—':dstr(TRENDK,chg)}</div></div>
     <div class="tile"><div class="k">Sessions</div><div class="v">${S.length}</div></div>`;
  const table=PR?`<div class="hint">${esc(PR.label)}. "Real" means the change holds up comparing visit against visit; maxes are
       single balls and top-quarter averages have no clean error bar, so neither is tested.</div>
     <div class="scroll"><table><thead><tr><th>Metric</th><th>Start</th><th>Now</th><th>Change</th><th>Read</th><th>Best</th></tr></thead><tbody>`+
     PR.rows.map(r=>{const bs=best(r.m.k);
       return `<tr class="clickable" onclick="TRENDK='${r.m.k}';render();window.scrollTo(0,0)"><td>${r.m.n}</td><td>${fmt(r.m.k,r.f)}</td>
        <td style="font-weight:700">${fmt(r.m.k,r.l)}</td><td class="${r.tested?r.cls:'flat'}" style="font-weight:700">${r.d==null?'—':dstr(r.m.k,r.d)}</td>
        <td style="color:var(--dim);font-size:12.5px">${esc(r.read)}</td><td>${bs?fmt(r.m.k,bs.v):'—'}</td></tr>`}).join('')+`</tbody></table></div>`
   :`<div class="scroll"><table><thead><tr><th>Metric</th><th>First</th><th>Latest</th><th>Change</th><th>Best</th></tr></thead><tbody>`+
     avail.map(m=>{const s2=series(m.k),f=s2[0],l=s2[s2.length-1],d=s2.length>1?l.v-f.v:null,bs=best(m.k);
       return `<tr class="clickable" onclick="TRENDK='${m.k}';render();window.scrollTo(0,0)"><td>${m.n}</td><td>${fmt(m.k,f.v)}</td>
        <td style="font-weight:700">${fmt(m.k,l.v)}</td><td class="${dirClass(m.k,d)}" style="font-weight:700">${d==null?'—':dstr(m.k,d)}</td>
        <td>${bs?fmt(m.k,bs.v):'—'}</td></tr>`}).join('')+`</tbody></table></div>`;
  return `<div style="margin-top:14px">${trendModeBar()}</div><div class="card">
   <h2>Trends</h2><div class="hint">${VIEWKIND==='games'
     ?'Season to date after each game. Counting stats are running totals.'
     :'Dots are sized by sample — hollow ones are too small to trust. The dashed blue rolling average is weighted by sample size, so a 5-ball session can’t swing it.'}</div>
   <div style="margin:10px 0"><select onchange="TRENDK=this.value;render()" style="max-width:280px">
     ${avail.map(m=>`<option value="${m.k}" ${m.k===TRENDK?'selected':''}>${m.n}</option>`).join('')}
   </select></div>
   ${lineChart(series(TRENDK),TRENDK,{band})}
   <div class="tiles" style="margin-top:14px">${tiles}</div></div>
   <div class="card"><h2>All metrics at a glance</h2>${table}</div>`;
}

/* ---------- sessions ---------- */
function vSessions(){
  const S=sorted().reverse();

  const cat=VIEWKIND==='catching';
  const cols=VIEWKIND==='games'
    ?[['pa','PA'],['h','H'],['avg','AVG'],['obp','OBP'],['slg','SLG'],['rbi','RBI']]
    :(cat?[['throws','Throws'],['bestPop','Best pop'],['avgPop','Avg pop'],['avgExch','Exchange'],['maxVelo','Max arm'],['onTarget','On target']]
         :[['swings','BIP'],['maxEV','Max EV'],['avgEV','Avg EV'],['hha','HHA'],['ld','LD%'],['avgLA','Avg LA']]);
  return `<div class="card"><h2>${VIEWKIND==='games'?'All games':('All '+(cat?'catching':'hitting')+' sessions')}</h2>
  <div class="hint">${S.length} logged · tap a row for the full breakdown</div>
  <div class="scroll"><table><thead><tr><th>Date</th><th>Type</th><th>Pitch</th>${cols.map(c=>'<th>'+c[1]+'</th>').join('')}<th></th></tr></thead><tbody>`+
  S.map(s=>{const st=sessionStats(s);
   const cap=t=>`<div style="font-size:10.5px;color:var(--amber);font-weight:700;letter-spacing:.04em">${t}</div>`;
   return `<tr class="clickable" onclick="openSession('${esc(s.id)}')"><td>${esc(s.date)}${s.solo?cap('SEPARATE ROUND'):''}${
      s.snap?cap(esc(snapLabel(s)).toUpperCase()+' · FROM SEASON TOTALS'):''}${s.base3&&!s.solo?cap('TO 3B · NOT IN 2B TRENDS'):''}</td>
    <td>${typeSelect(s)}</td>
    <td>${s.pitch!=null?Math.round(s.pitch)+'<small style="color:var(--dim)"> mph</small>':'—'}</td>`+
    cols.map((c,i)=>{const v=num(st[c[0]]);
      return `<td${i===1?' style="font-weight:700"':''}>${v==null?'—':(MK[c[0]].u==='%'?Math.round(v)+'%':fmt(c[0],v))}</td>`}).join('')+

      :(s.mode==='detail'?'<span class="chip">detail</span>':'')}</td></tr>`}).join('')+
  `</tbody></table></div></div>`+excludedCard();
}
// Session type is editable after the fact — HitTrax doesn't record it, so it's guesswork at
// upload time. Editing a grouped day retypes every round in it.
function typeSelect(s,small){
  const list=STYPES[kindOf(s)].slice();
  if(s.type&&!list.includes(s.type))list.unshift(s.type);     // e.g. a merged "Front toss + Tee"
  return `<select class="inline${small?' sm':''}" onclick="event.stopPropagation()"
    onchange="event.stopPropagation();setType('${esc(s.id)}',this.value)">
    ${!s.type?'<option value="" selected>—</option>':''}
    ${list.map(o=>`<option${o===s.type?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
}
function setType(id,val){
  const s=findSession(id); if(!s)return;
  (s.parts||[s]).forEach(pt=>{const raw=DB.sessions.find(x=>x.id===pt.id); if(raw){raw.type=val;raw.mtime=Date.now()}});
  save(); render();
  if(dlg.open&&OPENID)openSession(OPENID);   // keep an open breakdown in step
}

     balls.map((b,i)=>`<tr><td>${i+1}</td><td>${(+b.ev).toFixed(1)}</td><td>${b.la!=null?(+b.la).toFixed(0)+'°':'—'}</td>
       <td>${b.dist!=null?Math.round(b.dist):'—'}</td><td>${((b.btype||bucket(b.la))||'—').toUpperCase()}</td><td>${esc(b.result||'—')}${SUS.has(b)?' <span class="chip a">misread? not counted</span>':''}</td></tr>`).join('')+
     `</tbody></table></div></div>`:''}
   ${roundsTable(s,id)}`;
  initFlights();

}
// Rounds on the same date can come from different pitchers — the pitch speed and exit velo
// per round make that obvious, and each round can be grouped, kept separate or excluded.
function roundsTable(s,id){
  const rounds=roundsOfDate(s), cat=kindOf(s)==='catching';
  if(rounds.length<2)
    return `<div class="row" style="margin-top:18px"><button class="btn ghost" onclick="delSession('${esc(id)}')"
      style="color:var(--red);border-color:rgba(239,77,90,.4)">Delete session</button></div>`;
  const head=cat?['Round','Throws','Pitch in','Avg pop']:['Round','Balls','Avg pitch','Avg EV','Bat speed'];
  return `<div style="margin-top:18px"><label>${rounds.length} rounds logged on ${esc(s.date)}</label>
    <div class="hint" style="margin:-4px 0 8px">Different pitcher or machine setting? Keep that round separate so its
      numbers don't average into the rest of the day — or drop it out of the totals entirely.</div>
    <div class="scroll"><table><thead><tr>${head.map(h=>'<th>'+h+'</th>').join('')}<th>Type</th><th>Counts as</th><th></th></tr></thead><tbody>`+
    rounds.map((pt,i)=>{
      const st=sessionStats(pt), d=dispo(pt), n=((cat?pt.throws:pt.balls)||[]).length;
      const ks=cat?['avgPop','maxVelo']:['avgEV','maxEV'];
      const here=pt.id===id||(s.parts||[]).some(x=>x.id===pt.id);
      return `<tr style="${d==='out'?'opacity:.5':''}">
        <td>#${i+1}${here?'':' <span class="chip" style="font-size:9px">other</span>'}</td>
        <td>${n||'—'}</td>
        <td>${pt.pitch!=null?Math.round(pt.pitch)+'<small style="color:var(--dim)"> mph</small>':'—'}</td>
        <td style="font-weight:700">${fmt(ks[0],num(st[ks[0]]))}</td>
        ${cat?'':`<td>${num(st.batSpeed)!=null?num(st.batSpeed).toFixed(1)+'<small style="color:var(--dim)"> mph</small>':'—'}</td>`}
        <td>${typeSelect(pt,true)}</td>
        <td><select class="inline sm" onchange="setGroup('${esc(pt.id)}',this.value)">
          ${Object.keys(GROUPS).map(g=>`<option value="${g}"${g===d?' selected':''}>${GROUPS[g]}</option>`).join('')}
        </select></td>
        <td><button class="btn ghost" style="padding:4px 10px;font-size:12px;color:var(--red);border-color:rgba(239,77,90,.4)"
          onclick="delSession('${esc(pt.id)}')">Delete</button></td></tr>`}).join('')+
    `</tbody></table></div></div>`;
}
function delSession(id){
  if(!confirm('Delete this round? This cannot be undone.'))return;
  OPENID=null;
  DB.sessions=DB.sessions.filter(s=>s.id!==id);
  DB.deleted.push({id,ts:Date.now()});      // tombstone, so the delete syncs instead of the row coming back
  pruneFiles();
  save(); dlg.close(); render();
}

/* ---------- report ---------- */
/* Games get their own report: a season line, the catching and fielding lines, and a game log —
   none of the cage's exit-velo machinery applies to a box score. */
function gamesReport(){
  const S=sorted('games');
  if(!S.length)return '<div class="card"><div class="empty">Log a game (or a GameChanger season line) to build a game report.</div></div>';
  const t=sumGames(S.map(s=>sessionStats(s)));
  const pct=v=>v==null?'—':Math.round(v)+'%', a3=v=>v==null?'—':avg3(v), cnt=v=>num(v)==null?0:num(v);
  const cell=(label,v)=>`<td><div class="hint" style="font-size:11px">${label}</div><div style="font-weight:800;font-size:16px">${v}</div></td>`;
  const strip=cells=>`<div class="scroll"><table><tbody><tr>${cells.join('')}</tr></tbody></table></div>`;
  const bat=strip([cell('G',t.gp),cell('PA',cnt(t.pa)),cell('AB',cnt(t.ab)),cell('H',cnt(t.h)),cell('2B',cnt(t.d)),cell('3B',cnt(t.t)),
    cell('HR',cnt(t.hr)),cell('BB',cnt(t.bb)),cell('SO',cnt(t.k)),cell('HBP',cnt(t.hbp)),cell('RBI',cnt(t.rbi)),cell('R',cnt(t.r)),cell('SB',cnt(t.sb))]);
  const rates=strip([cell('AVG',a3(t.avg)),cell('OBP',a3(t.obp)),cell('SLG',a3(t.slg)),cell('OPS',a3(t.ops)),cell('K%',pct(t.kPct)),
    cell('BB%',pct(t.bbPct))].concat(t.qabPct!=null?[cell('QAB%',pct(t.qabPct))]:[],t.psPA!=null?[cell('P/PA',t.psPA.toFixed(2))]:[],
    t.babip!=null?[cell('BABIP',a3(t.babip))]:[]));
  const catchLine=(t.outs||t.pb!=null||t.csa!=null||t.sba!=null)?strip([cell('INN',innStr(t.outs)),cell('PB',cnt(t.pb)),
    cell('PB / 6 inn',t.pb6!=null?t.pb6.toFixed(1):'—'),cell('SB allowed',cnt(t.sba)),cell('CS',cnt(t.csa)),cell('CS%',pct(t.csPct))]):'';
  const fieldLine=(t.po!=null||t.a!=null||t.e!=null)?strip([cell('PO',cnt(t.po)),cell('A',cnt(t.a)),cell('E',cnt(t.e)),
    cell('FPCT',t.fpct!=null?t.fpct.toFixed(3).replace(/^0/,''):'—')]):'';
  const log=S.slice().reverse().map(s=>{const g=sessionStats(s);
    const what=s.snap?snapLabel(s)+' <small style="color:var(--dim)">(season update)</small>':esc(s.type||'Game');
    return `<tr><td>${esc(s.date)}</td><td>${what}</td><td>${cnt(g.pa)}</td><td>${cnt(g.h)}-${cnt(g.ab)}</td><td>${cnt(g.xbh)}</td>
      <td>${cnt(g.bb)}</td><td>${cnt(g.k)}</td><td>${cnt(g.rbi)}</td><td style="font-weight:700">${a3(g.avg)}/${a3(g.obp)}/${a3(g.slg)}</td></tr>`}).join('');
  return `<div class="card">
    <div class="row noprint"><button class="btn" onclick="window.print()">Print / save as PDF</button>
      <button class="btn sec" onclick="copyReport()">Copy as text</button></div>
    <h2 style="margin-top:14px;font-size:20px">${esc(DB.player.name||'Player')} — game report</h2>
    <div class="hint">${esc(S[0].date)} → ${esc(S[S.length-1].date)} · ${t.gp} game${t.gp>1?'s':''}${DB.player.level?' · '+esc(DB.player.level):''}</div>
    <label style="margin-top:14px">At the plate</label>${bat}${rates}
    ${catchLine?`<label style="margin-top:14px">Behind the plate</label>${catchLine}`:''}
    ${fieldLine?`<label style="margin-top:14px">In the field</label>${fieldLine}`:''}
    ${(t.pa||0)<30?`<div class="hint" style="margin-top:10px">${t.pa||0} plate appearances is a small sample — a single hit moves the average a lot this early.</div>`:''}
   </div>
   <div class="card"><h2>OPS — season to date</h2>${lineChart(series('ops'),'ops')}</div>
   <div class="card"><h2>Game log</h2><div class="hint">Season updates from GameChanger show as the games they added since the one before.</div>
     <div class="scroll"><table><thead><tr><th>Date</th><th>Game</th><th>PA</th><th>H-AB</th><th>XBH</th><th>BB</th><th>SO</th><th>RBI</th><th>AVG/OBP/SLG</th></tr></thead>
     <tbody>${log}</tbody></table></div></div>`;
}
function vReport(){
  if(VIEWKIND==='games')return gamesReport();
  const S=sorted();
  if(S.length<2)return '<div class="card"><div class="empty">Log at least two sessions to build a progress report.</div></div>';
  const from=S[0].date,to=S[S.length-1].date, cat=VIEWKIND==='catching';
  const b=cat?popBench(DB.player.age):bench(DB.player.age);
  // the first visits against the latest, pooled and tested — what a coach should read, not two single days
  const PR=progressRows(VIEWKIND);
  const rows=PR?PR.rows.map(r=>{const bs=best(r.m.k);
    return `<tr><td>${r.m.n}</td><td>${fmt(r.m.k,r.f)}</td><td style="font-weight:700">${fmt(r.m.k,r.l)}</td>
      <td class="${r.tested?r.cls:'flat'}" style="font-weight:700">${r.d==null?'—':dstr(r.m.k,r.d)}</td>
      <td style="color:var(--dim);font-size:12.5px">${esc(r.read)}</td><td>${bs?fmt(r.m.k,bs.v)+' · '+bs.date:'—'}</td></tr>`}).join('')
   :KIND[VIEWKIND].metrics.map(m=>{const s2=series(m.k); if(s2.length<2)return'';
    const f=s2[0].v,l=s2[s2.length-1].v,d=l-f,bs=best(m.k);
    return `<tr><td>${m.n}</td><td>${fmt(m.k,f)}</td><td style="font-weight:700">${fmt(m.k,l)}</td>
      <td class="${dirClass(m.k,d)}" style="font-weight:700">${dstr(m.k,d)}</td><td style="color:var(--dim);font-size:12.5px">typed summaries — not tested</td>
      <td>${bs?fmt(m.k,bs.v)+' · '+bs.date:'—'}</td></tr>`}).filter(Boolean).join('');
  return `<div class="card">
    <div class="row noprint"><button class="btn" onclick="window.print()">Print / save as PDF</button>
      <button class="btn sec" onclick="copyReport()">Copy as text</button></div>
    <h2 style="margin-top:14px;font-size:20px">${esc(DB.player.name||'Player')} — HitTrax ${cat?'catching':'hitting'} progress report</h2>
    <div class="hint">${from} → ${to} · ${S.length} sessions${DB.player.age?' · age '+esc(DB.player.age):''}${DB.player.level?' · '+esc(DB.player.level):''}</div>
    ${PR?`<div class="hint" style="margin-top:8px">${esc(PR.label)}. "Real" means the change holds up comparing visit against visit,
      so one good day can't make it; maxes are single balls and top-quarter averages have no clean error bar, so neither is tested.</div>`:''}
    <div class="scroll" style="margin-top:12px"><table><thead><tr><th>Metric</th><th>Start</th><th>Now</th><th>Change</th><th>Read</th><th>Best</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    ${b?`<div class="note" style="margin-top:14px">Age-group reference (${b.label}): ${cat
      ?`pop time average ${b.avg[0].toFixed(2)}–${b.avg[1].toFixed(2)}s · good ${b.good.toFixed(2)}s · elite ${b.elite.toFixed(2)}s or quicker.`
      :`average ${b.avg[0]}–${b.avg[1]} mph · good ${b.good[0]}–${b.good[1]} mph · elite ${b.elite}+ mph max exit velo.`}</div>`:''}
   </div>
   ${cat?'':(()=>{const balls=S.flatMap(x=>x.balls||[]);
     return thirdsCard(balls,`across ${S.length} session${S.length>1?'s':''}`)+zoneCard(balls,`across ${S.length} session${S.length>1?'s':''}`);})()}
   ${cat?`<div class="card"><h2>Average pop time</h2>${lineChart(series('avgPop'),'avgPop',b?{band:[b.elite,b.good]}:{})}</div>
     <div class="card"><h2>Arm strength</h2>${lineChart(series('maxVelo'),'maxVelo')}</div>`
   :`<div class="card"><h2>Max exit velo</h2>${lineChart(series('maxEV'),'maxEV',b?{band:[b.good[0],b.good[1]]}:{})}</div>
     <div class="card"><h2>Hard-hit average</h2>${lineChart(series('hha'),'hha')}</div>`}
   <div class="card"><h2>Session log</h2><div class="scroll"><table><thead><tr><th>Date</th><th>Type</th>
     <th>${cat?'Throws':'BIP'}</th><th>${cat?'Best pop':'Max EV'}</th><th>${cat?'Avg pop':'Avg EV'}</th><th>Notes</th></tr></thead><tbody>`+
   S.slice().reverse().map(s=>{const st=sessionStats(s); const ks=cat?['throws','bestPop','avgPop']:['swings','maxEV','avgEV'];
     return `<tr><td>${esc(s.date)}</td><td>${esc(s.type||'')}</td><td>${num(st[ks[0]])!=null?Math.round(st[ks[0]]):'—'}</td>
      <td>${fmt(ks[1],num(st[ks[1]]))}</td><td>${fmt(ks[2],num(st[ks[2]]))}</td>
      <td style="white-space:normal;color:var(--dim);max-width:280px">${esc(s.notes||'')}</td></tr>`}).join('')+
   `</tbody></table></div></div>`;
}
function copyReport(){
  if(VIEWKIND==='games'){
    const S=sorted('games'), g=sumGames(S.map(s=>sessionStats(s))), f=v=>v==null?'—':avg3(v);
    let txt=`${DB.player.name||'Player'} — game report\n${S[0].date} → ${S[S.length-1].date} · ${g.gp} games · ${g.pa||0} PA\n\n`+
      `${g.h||0}-for-${g.ab||0}, ${f(g.avg)}/${f(g.obp)}/${f(g.slg)}, OPS ${f(g.ops)}\n`+
      `${g.xbh||0} XBH · ${g.rbi||0} RBI · ${g.r||0} R · ${g.bb||0} BB · ${g.k||0} SO · ${g.sb||0} SB\n`+
      (g.kPct!=null?`K ${Math.round(g.kPct)}% · BB ${Math.round(g.bbPct)}%${g.qabPct!=null?` · QAB ${Math.round(g.qabPct)}%`:''}\n`:'')+
      (g.outs?`Catching: ${innStr(g.outs)} inn · ${g.pb||0} PB${g.pb6!=null?` (${g.pb6.toFixed(1)} per 6)`:''} · ${g.csa||0} CS of ${(g.csa||0)+(g.sba||0)} attempts\n`:'');
    navigator.clipboard.writeText(txt).then(()=>alert('Report copied.'),()=>alert('Copy failed.'));
    return;
  }
  const S=sorted(); let t=`${DB.player.name||'Player'} — HitTrax progress\n${S[0].date} → ${S[S.length-1].date} · ${S.length} sessions\n\n`;
  const PR=progressRows(VIEWKIND);
  if(PR){t+=PR.label+'\n\n';
    PR.rows.forEach(r=>{if(r.f==null||r.l==null)return;
      t+=`${r.m.n}: ${fmt(r.m.k,r.f)} → ${fmt(r.m.k,r.l)} (${dstr(r.m.k,r.d)}${r.read!=='—'?', '+r.read:''})\n`})}
  else KIND[VIEWKIND].metrics.forEach(m=>{const s2=series(m.k); if(s2.length<2)return;
    const f=s2[0].v,l=s2[s2.length-1].v;
    t+=`${m.n}: ${fmt(m.k,f)} → ${fmt(m.k,l)} (${dstr(m.k,l-f)})\n`});
  navigator.clipboard.writeText(t).then(()=>alert('Report copied.'),()=>alert('Copy failed.'));
}

/* ---------- player & data ---------- */
function vData(){
  const p=DB.player;
  return `<div class="card"><h2>Player</h2><div class="hint">Age sets the benchmark band and the default hard-hit threshold.</div>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
     <div><label>Name</label><input id="p_name" value="${esc(p.name||'')}"></div>
     <div><label>Age</label><input id="p_age" type="number" value="${esc(p.age||'')}"></div>
     <div><label>Level / team</label><input id="p_level" value="${esc(p.level||'')}" placeholder="e.g. 12U travel"></div>
     <div><label>Bats</label><select id="p_bats"><option ${p.bats==='R'?'selected':''}>R</option><option ${p.bats==='L'?'selected':''}>L</option><option ${p.bats==='S'?'selected':''}>S</option></select></div>
     <div><label>Hard-hit threshold (mph)</label><input id="p_hh" type="number" value="${esc(DB.settings.hardHit||'')}" placeholder="auto: ${hardHitDefault(p.age)}"></div>
     <div><label>Bat</label><select id="p_batq">
       ${[[0.20,'Wood / BBCOR — or not sure'],[0.24,'Youth aluminum or composite (USSSA / USA)']]
         .map(o=>`<option value="${o[0]}"${Math.abs(Q()-o[0])<0.005?' selected':''}>${o[1]}</option>`).join('')}
     </select></div>
     <div><label>Strike-zone calibration</label><select id="p_zcal">
       ${[['none','Use HitTrax zones as exported'],['mirror','Mirror left ↔ right'],
          ['left','Shift one column left'],['right','Shift one column right']]
         .map(o=>`<option value="${o[0]}"${(DB.settings.zoneCal||'none')===o[0]?' selected':''}>${o[1]}</option>`).join('')}
     </select></div>
   </div>
   <div class="hint" style="margin-top:8px">Only change the calibration if a ball fed down the middle at the cage comes back
     in a side column. It relabels zones for display — the exit velo, angles and distances are never touched.</div>
   <div style="margin-top:12px"><button class="btn" onclick="savePlayer()">Save</button></div></div>

   <div class="card"><h2>Sync across devices</h2>
   <div class="hint">Sign in with your Wilson Dashboard account and every device shares one history — log on the phone at the cage, read it on the laptop.</div>
   <div id="acctState">${accountPanel()}</div>
   <div class="row" style="margin-top:12px"><button class="btn ${session?'sec':''}" onclick="openAccount()">${session?'Manage sync':'Sign in to sync'}</button></div></div>

   <div class="card"><h2>Source files</h2>
   <div class="hint">Every upload is kept with its session, so when the app learns a new HitTrax column
     your old sessions pick it up on their own — no re-uploading.</div>
   <div class="tiles">
     <div class="tile"><div class="k">Files kept</div><div class="v">${Object.keys(DB.files||{}).length}</div></div>
     <div class="tile"><div class="k">Space used</div><div class="v">${(fileBytes()/1024).toFixed(0)}<small>KB</small></div></div>
     <div class="tile"><div class="k">Sessions linked</div><div class="v">${DB.sessions.filter(s=>s.src&&DB.files&&DB.files[s.src.f]).length}<small>of ${DB.sessions.length}</small></div></div>
   </div>
   <div class="row" style="margin-top:12px"><button class="btn sec" onclick="reparseNow()">Re-read them now</button>
     <button class="btn ghost" onclick="dropFiles()">Delete stored files</button></div></div>

   <div class="card"><h2>Backup &amp; transfer</h2>
   <div class="hint">${session?'Synced to your account — an export is still the belt-and-braces copy.':'Data lives in this browser only. Export before switching phones or clearing history.'}</div>
   <div class="row"><button class="btn sec" onclick="expJSON()">Export backup (.json)</button>
     <button class="btn sec" onclick="expCSV()">Export sessions (.csv)</button>
     <button class="btn ghost" onclick="document.getElementById('imp').click()">Import backup</button>
     <input type="file" id="imp" accept=".json" style="display:none" onchange="impJSON(this)"></div>
   <div class="row" style="margin-top:16px"><button class="btn ghost" style="color:var(--red);border-color:rgba(239,77,90,.4)" onclick="wipe()">Erase everything</button></div></div>

   ${refCard()}

   <div class="card"><h2>How the numbers are defined</h2>
   <ul class="tight">
    <li><b>Launch-angle buckets:</b> ground ball &lt;10°, line drive 10–25°, fly ball 25–50°, pop-up &gt;50°</li>
    <li><b>Sweet-spot LA %:</b> share of batted balls between 8° and 32°</li>
    <li><b>Hard-hit average:</b> share of batted balls at or above ${HH()} mph exit velo</li>
    <li><b>Hard + sweet-spot %:</b> at or above ${HH()} mph <i>and</i> between 8° and 32°. Not Statcast's "barrel", whose angle window
      widens with exit velo and starts at 98 mph — this is the simple youth version: hit hard, at a launch angle that plays</li>
    <li><b>Launch angle spread:</b> the standard deviation of his launch angles — lower means a more repeatable swing path.
      Read it alongside sweet-spot %: a tight cluster of ground balls is tight too</li>
    <li><b>Top-25% avg EV:</b> average of the hardest quarter of the round — steadier than a single max, better than the overall average for tracking real power gains</li>
    <li><b>Catching — pop time:</b> glove impact to the ball reaching 2B; <b>exchange</b> is the receive-to-release part of it, <b>arm strength</b> is peak throw velocity</li>
    <li><b>Catching — on-target %:</b> throws finishing within ${ON_TARGET_IN} in of the bag (or the file's own on/off-target flag); <b>projected outs %</b> uses HitTrax's out/safe call</li>
    <li><b>Top-25% avg pop:</b> average of the quickest quarter of the round — what he can repeat, not a one-off</li>
   </ul>
   <div class="note warn" style="margin-top:12px">Compare like with like: tee, front toss, machine and live BP produce different exit velos.
   Filter your read by session type when you judge progress.</div></div>`;
}
function reparseNow(){
  const n=backfillAll();
  if(n){DB.parserV=PARSER_V; save();}
  render(); alert(n?`Re-read the stored files — ${n} session${n>1?'s':''} updated.`:'Re-read the stored files — everything was already current.');
}
function dropFiles(){
  if(!confirm('Delete the stored source files? Your sessions and their numbers stay, but future columns will need a re-upload.'))return;
  DB.files={}; DB.sessions.forEach(s=>delete s.src); save(); render();
}
function savePlayer(){
  const g=id=>document.getElementById(id).value.trim();
  const before=HH();
  DB.player={name:g('p_name'),age:g('p_age'),level:g('p_level'),bats:document.getElementById('p_bats').value};
  const hh=num(g('p_hh')); DB.settings.hardHit=hh||null;
  const zc=document.getElementById('p_zcal'); if(zc)DB.settings.zoneCal=zc.value;
  const qBefore=Q(); const bqEl=document.getElementById('p_batq'); if(bqEl)DB.settings.batQ=+bqEl.value;
  const qAfter=Q();
  const bqLogged=DB.sessions.filter(s=>kindOf(s)==='hitting'&&s.bq&&Math.abs(s.bq-qAfter)>0.001);
  if(Math.abs(qAfter-qBefore)>0.001&&bqLogged.length&&
     confirm(`Bat setting changed. Re-estimate bat speed on your ${bqLogged.length} earlier session${bqLogged.length>1?'s':''} with the new bat too?

OK = re-estimate everything (right if the old setting was simply wrong).
Cancel = keep earlier sessions as logged (right if he has switched bats).`)){
    const now=Date.now(); bqLogged.forEach((s,i)=>{s.bq=qAfter;s.mtime=now+i});
  }
  const after=HH();
  const logged=DB.sessions.filter(s=>kindOf(s)==='hitting'&&s.hh&&s.hh!==after);
  if(after!==before&&logged.length){
    // default is to leave history alone — re-scoring everything is the user's explicit call
    if(confirm(`The hard-hit line is now ${after} mph (was ${before}).

Re-score your ${logged.length} earlier session${logged.length>1?'s':''} at ${after} mph too?

OK = re-score everything at ${after}.
Cancel = keep each session at the line it was logged with (recommended — keeps your trend honest).`)){
      const now=Date.now(); logged.forEach((s,i)=>{s.hh=after;s.mtime=now+i});
    }
  }
  save(); render(); alert('Saved.');
}
function dl(name,text,type){
  const blob=(text instanceof Blob)?text:new Blob([text],{type});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function expJSON(){dl(`hittrax-backup-${localDate()}.json`,JSON.stringify(DB,null,2),'application/json')}
function expCSV(){
  const ks=KIND[VIEWKIND].metrics.map(m=>m.k);
  let csv='date,type,location,pitch_speed,'+ks.join(',')+',notes\n';
  sorted().forEach(s=>{const st=sessionStats(s);
    csv+=[s.date,s.type||'',s.location||'',s.pitch||''].map(v=>`"${(''+v).replace(/"/g,'""')}"`).join(',')+','+
      ks.map(k=>num(st[k])!=null?(+st[k]).toFixed(MK[k].d):'').join(',')+
      `,"${(s.notes||'').replace(/"/g,'""')}"\n`});
  dl(`hittrax-${VIEWKIND}-${localDate()}.csv`,csv,'text/csv');
}
function impJSON(inp){
  const f=inp.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!d.sessions)throw new Error('Not a tracker backup');
    if(!confirm(`Import ${d.sessions.length} sessions? They merge in with what's already here — nothing is replaced.`))return;
    const inc=sanitizeDoc(d); inc.updatedAt=Date.now();
    if(!inc.sessions.length)throw new Error('No usable sessions in that file');
    DB=mergeDocs(DB,inc); save(); render(); alert('Imported.');
  }catch(e){alert('Import failed: '+e.message)} };
  r.readAsText(f); inp.value='';
}
function wipe(){
  if(!confirm('Erase all sessions and player info?'))return;
  if(!confirm('Really erase? Export a backup first if you want to keep it.'))return;
  const ts=Date.now(), tombs=DB.sessions.map(s=>({id:s.id,ts}));   // so the erase syncs to your other devices too
  DB=blank(); DB.deleted=tombs; save(); render();
}

/* ============================== boot ============================== */
(function(){const el=document.getElementById('hubLink');
  if(el&&location.pathname.replace(/\/+$/,'')!=='')el.hidden=false;})();
try{document.getElementById('buildTag').textContent=APP_BUILD}catch(e){}
readSession();
// a device that already knows its borrowed sign-in died should still say so, not just "local"
if(!session)try{EXPIRED=!!localStorage.getItem(DEADTOK)}catch(e){}
DB=load();
// sessions from before thresholds were frozen: pin them at today's threshold, so the next age
// change can't silently rewrite their hard-hit numbers
(function(){let n=0; DB.sessions.forEach(s=>{if(kindOf(s)!=='hitting')return;
  if(!s.hh){s.hh=HH();n++} if(!s.bq){s.bq=Q();n++}}); if(n)saveLocal();})();
// open on whichever discipline was logged most recently
(function(){const last=DB.sessions.slice().sort((a,b)=>a.date<b.date?-1:1).pop();
  if(last)VIEWKIND=kindOf(last); TRENDK=TRENDDEF[VIEWKIND]; LOGKIND=VIEWKIND;})();
// parser moved on since this data was written? re-read the stored files
if((DB.parserV||0)!==PARSER_V){
  const n=backfillAll(); DB.parserV=PARSER_V;
  if(n){DB.updatedAt=Date.now(); BACKFILLED=n}
  saveLocal();
}
render();
(function(){if(TEST)return; const inc=readImportLink(); if(inc)setTimeout(()=>offerImport(inc),60)})();
setSync(session?'saving':'local');
startSync();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&session)pullMerge()});
</script>
